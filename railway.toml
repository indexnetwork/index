# Railway API service configuration.
[build]
watchPatterns = ["/services/api/**", "/packages/protocol/**", "/packages/a2a/**", "/packages/agent/**", "/bun.lock", "/package.json", "/railway.toml"]
buildCommand = "bun run build:package:a2a && bun run build:package:agent && bun run build:package:protocol && bun run build:api"

[deploy]
preDeployCommand = "cd services/api && bun run db:migrate"
startCommand = "cd services/api && bun run start"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
