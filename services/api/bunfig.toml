[test]

# Bun does not discover files named *.isolated.ts. The discoverable
# tests/isolated-suite.spec.ts validates .test-isolated against the filesystem
# and executes every entry in a fresh Bun subprocess. This makes bare `bun test`,
# `bun run test`, and `bun run test:all` equivalent complete baselines.

# Preload the repo-root .env.test before any test module runs so env vars are
# available before module-level imports. Full-suite invocations also perform a
# bounded connectivity/schema probe against the explicitly disposable test DB.
preload = ["./src/preload.test.ts"]

# The integration baseline shares one disposable remote Postgres database.
# Two concurrent files keep Neon round trips below hook/test budgets; four still
# saturates the single-CU disposable compute during the literal bare baseline.
maxConcurrency = 2
