# Railway hosted-agents service configuration (no HTTP server, no migrations).
[build]
watchPatterns = ["/services/api/**", "/packages/protocol/**", "/packages/agent/**", "/packages/client/**", "/bun.lock", "/package.json"]
buildCommand = "bun run build:package:protocol && bun run build:api"

[deploy]
startCommand = "cd services/api && bun run start:hosted-agents"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
