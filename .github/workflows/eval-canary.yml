# Budgeted scheduled live-eval canary (IND-447).
#
# Runs the committed canary manifest (packages/protocol/eval/canary/
# canary.manifest.json) — a small, representative, hard-capped subset of the
# baseline-backed live eval suites — against real providers, on a low-frequency
# schedule or on manual dispatch. Both paths execute the same committed
# manifest, so artifacts stay comparable run-over-run.
#
# NON-BLOCKING BY DESIGN: this workflow has no pull_request or push triggers
# and must never be made a required check. A red run is an informational alert
# (provider incident, measured regression, baseline incompatibility, or
# insufficient evidence — see the job summary); it does not gate merges or
# releases and never auto-reverts anything. Making the canary a release gate
# would be a separate, explicit human decision (see eval/canary/README.md).
#
# MEASUREMENT-ONLY: the canary never passes --update-baseline, never pushes
# commits, and the "baselines untouched" step proves the committed baseline
# JSONs are byte-identical after the run. The full HyDE canonical study is
# excluded from routine scheduling by manifest validation.
#
# Secrets: OPENROUTER_API_KEY drives the harness models and the assertLLM
# judge. OPENAI_API_KEY is not consumed by the current manifest suites (only
# embedding-dependent paths like HyDE use it) and is intentionally NOT passed.
# ER3 sanitization plus the canary's own leak scan keep secrets out of logs and
# artifacts; GitHub additionally masks secret values in step output.
name: Eval live canary

on:
  workflow_dispatch:
    inputs:
      plan_only:
        description: "Provider-free plan/dry-run only (validate manifest + print budget, no provider calls)"
        type: boolean
        default: false
  schedule:
    # Weekly, Monday 05:17 UTC — low frequency by design (IND-447 requires
    # weekly or less). Off-peak minute to avoid GitHub's on-the-hour spikes.
    - cron: "17 5 * * 1"

# Exactly one canary at a time; a late manual dispatch queues rather than
# cancelling a live measurement in flight (artifacts must never be truncated).
concurrency:
  group: eval-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  canary:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Hard wall-clock budget cap. The plan's per-attempt deadlines bound each
    # provider call; this bounds the whole run regardless.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install dependencies
        run: |
          bun pm cache rm || true
          bun install --frozen-lockfile

      # Provider-free: validates the committed manifest, budget caps, and
      # prints pinned models, git SHA, fingerprints, and the budget estimate
      # before any credential is exposed to a process.
      - name: Plan (provider-free)
        run: cd packages/protocol && bun eval/canary/canary.eval.ts --plan

      - name: Run live canary
        if: ${{ !inputs.plan_only }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: cd packages/protocol && bun eval/canary/canary.eval.ts --out eval/canary/runs/ci

      # Measurement-only proof: committed baselines must be byte-identical.
      - name: Verify committed baselines untouched
        if: ${{ always() }}
        run: git diff --exit-code -- 'packages/protocol/eval/*/baselines/*.json'

      # Artifacts are ER3-sanitized by the harnesses and additionally pass the
      # canary's leak scan (offending files are deleted before this step).
      # Retention is bounded: 30 days is enough to compare consecutive weekly
      # runs and investigate an alert without accumulating provider output.
      - name: Upload canary artifacts
        if: ${{ always() && !inputs.plan_only }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-canary-${{ github.run_id }}
          path: packages/protocol/eval/canary/runs/ci
          retention-days: 30
          if-no-files-found: ignore
