# Run type checks, architectural boundary checks, adapter naming checks, and
# hermetic pinning tests on PRs to dev/main and on direct pushes to dev/main.
#
# Enforces protocol layering rules (eslint-plugin-boundaries),
# adapter naming conventions, and TypeScript compilation.
#
# `main` is included so release PRs (dev -> main) get an independent gate of
# their own rather than riding solely on the per-PR checks that ran into dev.
#
# NOTE: Only boundary violations fail the lint check. Pre-existing lint
# errors (no-explicit-any, no-unused-vars) are not gated here yet.
# Full lint enforcement is tracked separately.
name: Lint and typecheck

on:
  pull_request:
    branches: [dev, main, feat/protocol-cleanup]
  push:
    branches: [dev, main, feat/protocol-cleanup]

concurrency:
  group: lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.20"

      - name: Install dependencies
        run: |
          bun install
          cd services/api && bun install

      - name: Check architectural boundaries
        run: |
          cd services/api
          # shellcheck disable=SC2016
          bunx eslint src/ --format json 2>/dev/null | bun -e '
            const results = JSON.parse(await Bun.stdin.text());
            const violations = results
              .flatMap(r => r.messages.filter(m => m.ruleId === "boundaries/dependencies"))
              .map((m, i, _, r = results.find(r2 => r2.messages.includes(m))) =>
                `${r?.filePath}:${m.line} - ${m.message}`
              );
            if (violations.length > 0) {
              console.log("❌ Architectural boundary violations found:\n");
              violations.forEach(v => console.log(`  ${v}`));
              console.log(`\n${violations.length} violation(s) total.`);
              process.exit(1);
            } else {
              console.log("✅ No architectural boundary violations.");
            }
          '

      - name: Check adapter naming conventions
        run: ./scripts/check-adapter-names.sh

      # Subtree mirrors (indexnetwork/protocol, indexnetwork/cli, ...) build and
      # publish without the monorepo lockfile, so a floating range there resolves
      # to whatever is newest on npm instead of what this repo built. Gate it
      # here rather than discovering it in a mirror's publish run.
      - name: Check subtree mirror dependency parity
        run: bun run check:subtree-parity

  typecheck:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.20"

      - name: Install dependencies
        run: |
          bun install
          cd packages/protocol && bun install
          cd ../..
          cd services/api && bun install

      - name: Type check packages/protocol
        run: cd packages/protocol && bun run build

      - name: Type check API
        run: cd services/api && bun run build

      # `bun run build` compiles services/api/tsconfig.json, which excludes
      # `src/**/*.spec.ts`, so no spec is type-checked by the step above. That
      # matters for the discovery CLI specs, where one assertion *is* a type
      # assertion: `discovery.neon.spec.ts` proves `resetAbBranch` refuses an
      # unattested manifest with a `@ts-expect-error`, and a directive nobody
      # compiles proves nothing. See services/api/tsconfig.spec.json.
      - name: Type check the discovery CLI specs
        run: cd services/api && bun run typecheck:cli-specs

  test:
    # Runs the hermetic pinning/characterization specs that mock all external
    # systems (Redis/LLM/DB), so they need no services, secrets, or built
    # protocol dist. Keeps these regression pins gated in CI rather than
    # depending on local-only manual runs.
    #
    # NOTE: pinned to a newer Bun than the lint/typecheck jobs (1.2.20). The
    # specs use a deferred `await import()` of the queue (so a fallback
    # OPENROUTER_API_KEY is set before the protocol barrel's eager createModel
    # evaluates); under `bun test` 1.2.20 that dynamic import mis-resolves
    # drizzle-orm's `export * from "./relations.js"` re-export and fails to find
    # the `relations` named export. Newer Bun resolves it correctly. The app
    # runtime is unaffected (it imports the same schema fine).
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install dependencies
        run: |
          bun pm cache rm || true
          bun install --frozen-lockfile

      - name: Run hermetic pinning tests
        run: |
          cd services/api
          bun test \
            src/adapters/tests/can-actor-see-opportunity.spec.ts \
            src/adapters/tests/negotiation-lifecycle.projection.spec.ts \
            src/queues/tests/timeout.queue.spec.ts \
            src/queues/tests/claim-timeout.queue.spec.ts

  eval-cli-tests:
    # The services/api eval CLI specs, which ran local-only until now. They are
    # drift guards, and a drift guard nobody runs guards nothing: the discovery
    # set derives its offerable flags from the discovery graph's own import
    # closure and fails when that set moves, refuses an asymmetric or identical
    # configuration pair, and proves every artifact case row carries the
    # configuration it was produced under. The per-harness catalogue that feeds
    # the launch form is derived the same way and pinned in packages/protocol
    # (eval/ops/tests/envcatalog.spec.ts), which the `test` job runs.
    #
    # Separate from the `test` job above because these are not dist-free: the
    # discovery artifact and child specs import `discovery.main.ts`, which imports
    # `@indexnetwork/protocol` (that is, `packages/protocol/dist`, gitignored).
    # Hence the explicit build step. No secrets and no database: every spec here
    # fakes the control plane, the graph and the judge, and provider
    # credentials are stripped so a spec that reached for a live model fails.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install dependencies
        run: |
          bun pm cache rm || true
          bun install --frozen-lockfile

      - name: Build packages/protocol
        run: cd packages/protocol && bun run build

      - name: Run the eval CLI specs (discovery and env matrix)
        run: |
          unset OPENROUTER_API_KEY OPENAI_API_KEY
          cd services/api
          bun test src/cli/tests/

  protocol-source-tests:
    # Per-file processes prevent Bun mock.module state from leaking between
    # source specs. The runner also strips provider credentials and reports
    # each failing file's full diagnostics, so this remains a hermetic gate.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install dependencies
        run: |
          bun pm cache rm || true
          bun install --frozen-lockfile

      - name: Run credential-free protocol source tests
        run: |
          unset OPENROUTER_API_KEY OPENAI_API_KEY
          cd packages/protocol
          TEST_CONCURRENCY=4 bun run test:isolated

  eval-verify:
    # Provider-free verification of the protocol eval harnesses (IND-441):
    # type-checks every packages/protocol/eval/*/tsconfig.json and runs every
    # provider-free eval spec via a single manifest-checked command. Needs no
    # secrets — the script strips provider credentials from the child env, so
    # any spec that reaches for a live model fails loudly here. The explicit
    # suite manifest in eval/verify.ts means a new eval directory that is not
    # wired into verification fails this job instead of silently escaping CI.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install dependencies
        run: |
          bun pm cache rm || true
          bun install --frozen-lockfile

      - name: Verify eval suites (typecheck + provider-free tests)
        run: cd packages/protocol && bun run eval:verify

  protocol-architecture:
    # The packages/protocol architecture gates ran local-only until now, so
    # nothing stopped the public export inventory and its consumer fixture from
    # drifting when #1301 deleted the discovery-run interface — both were broken
    # on dev for days without any red check.
    #
    #
    # Steps stay individual rather than one `bun run architecture:check` so a
    # failure names the violated invariant directly in the checks list.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install dependencies
        run: |
          bun pm cache rm || true
          bun install --frozen-lockfile

      - name: Check public export inventory
        run: cd packages/protocol && bun run architecture:exports

      - name: Type check the external consumer fixture
        run: cd packages/protocol && bun run architecture:consumer

      - name: Check host isolation
        run: cd packages/protocol && bun run architecture:host-isolation

      - name: Check capability boundaries
        run: cd packages/protocol && bun run architecture:capabilities

      - name: Check production module cycles
        run: cd packages/protocol && bun run architecture:cycles

      - name: Check published artifact inventory
        run: cd packages/protocol && bun run architecture:artifacts

      - name: Run architecture tests
        run: cd packages/protocol && bun run test:architecture

  eval-ops:
    # The eval-ops app was excluded from the root build (by design: it is not
    # part of the API's deployment — it deploys as its own Railway service from
    # apps/eval-ops/railway.toml) but was also absent from CI entirely,
    # so neither typecheck nor the 47 vitest tests written in Tasks 12–17 gated
    # anything — which is how 8 type errors accumulated unnoticed.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install dependencies
        run: |
          bun pm cache rm || true
          bun install --frozen-lockfile

      - name: Type check eval-ops
        run: cd apps/eval-ops && bun run typecheck

      - name: Run eval-ops tests
        run: cd apps/eval-ops && bun run test

      - name: Lint eval-ops
        run: cd apps/eval-ops && bun run lint
