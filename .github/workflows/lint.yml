# Run type checks, architectural boundary checks, adapter naming checks, and
# hermetic pinning tests on PRs to dev/main and on direct pushes to dev/main.
#
# Enforces protocol layering rules (eslint-plugin-boundaries),
# adapter naming conventions, and TypeScript compilation.
#
# `main` is included so release PRs (dev -> main) get an independent gate of
# their own rather than riding solely on the per-PR checks that ran into dev.
#
# NOTE: Only boundary violations fail the lint check. Pre-existing lint
# errors (no-explicit-any, no-unused-vars) are not gated here yet.
# Full lint enforcement is tracked separately.
name: Lint and typecheck

on:
  pull_request:
    branches: [dev, main, feat/protocol-cleanup]
  push:
    branches: [dev, main, feat/protocol-cleanup]

concurrency:
  group: lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: "1.2.20"

      - name: Install dependencies
        run: |
          bun install
          cd services/api && bun install

      - name: Check architectural boundaries
        run: |
          cd services/api
          # shellcheck disable=SC2016
          bunx eslint src/ --format json 2>/dev/null | bun -e '
            const results = JSON.parse(await Bun.stdin.text());
            const violations = results
              .flatMap(r => r.messages.filter(m => m.ruleId === "boundaries/dependencies"))
              .map((m, i, _, r = results.find(r2 => r2.messages.includes(m))) =>
                `${r?.filePath}:${m.line} - ${m.message}`
              );
            if (violations.length > 0) {
              console.log("❌ Architectural boundary violations found:\n");
              violations.forEach(v => console.log(`  ${v}`));
              console.log(`\n${violations.length} violation(s) total.`);
              process.exit(1);
            } else {
              console.log("✅ No architectural boundary violations.");
            }
          '

      - name: Check adapter naming conventions
        run: ./scripts/check-adapter-names.sh

      # Subtree mirrors (indexnetwork/protocol, indexnetwork/cli, ...) build and
      # publish without the monorepo lockfile, so a floating range there resolves
      # to whatever is newest on npm instead of what this repo built. Gate it
      # here rather than discovering it in a mirror's publish run.
      - name: Check subtree mirror dependency parity
        run: bun run check:subtree-parity

      # Bun refreshes the workspace `version` fields in bun.lock only unreliably —
      # a version-only bump, where node_modules is already in sync, leaves them
      # stale — and `--frozen-lockfile` passes while they are, so a bump can land
      # with a lockfile that still names the old version.
      - name: Check lockfile workspace versions
        run: bun run check:lockfile-versions

  typecheck:
    # Keep this required correctness gate on GitHub-hosted capacity. A
    # Blacksmith allocation can remain queued indefinitely with runner_id=0,
    # leaving a locally clean TypeScript build unable to report a conclusion.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: "1.2.20"

      - name: Install dependencies
        run: |
          bun install
          cd packages/protocol && bun install
          cd ../..
          cd services/api && bun install

      - name: Type check packages/protocol
        run: cd packages/protocol && bun run build

      - name: Type check API
        run: cd services/api && bun run build

  test:
    # Runs the hermetic pinning/characterization specs that mock all external
    # systems (Redis/LLM/DB), so they need no services or secrets. The timeout
    # seams import shared protocol turn/speaker contracts through the package
    # boundary, so this job builds protocol dist before running them. Keeps
    # these regression pins gated in CI rather than
    # depending on local-only manual runs.
    #
    # NOTE: pinned to a newer Bun than the lint/typecheck jobs (1.2.20). The
    # specs use a deferred `await import()` of the queue (so a fallback
    # OPENROUTER_API_KEY is set before the protocol barrel's eager createModel
    # evaluates); under `bun test` 1.2.20 that dynamic import mis-resolves
    # drizzle-orm's `export * from "./relations.js"` re-export and fails to find
    # the `relations` named export. Newer Bun resolves it correctly. The app
    # runtime is unaffected (it imports the same schema fine).
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install dependencies
        run: |
          bun pm cache rm || true
          bun install --frozen-lockfile

      - name: Build packages/protocol
        run: cd packages/protocol && bun run build

      - name: Run hermetic pinning tests
        run: |
          cd services/api
          bun test \
            src/adapters/tests/can-actor-see-opportunity.spec.ts \
            src/adapters/tests/negotiation-lifecycle.projection.spec.ts \
            src/queues/tests/timeout.queue.spec.ts \
            src/queues/tests/claim-timeout.queue.spec.ts

  protocol-source-tests:
    # Per-file processes prevent Bun mock.module state from leaking between
    # source specs. The runner also strips provider credentials and reports
    # each failing file's full diagnostics, so this remains a hermetic gate.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install dependencies
        run: |
          bun pm cache rm || true
          bun install --frozen-lockfile

      - name: Run credential-free protocol source tests
        run: |
          unset OPENROUTER_API_KEY OPENAI_API_KEY
          cd packages/protocol
          TEST_CONCURRENCY=4 bun run test:isolated

  protocol-architecture:
    # Keep the architectural dependency checks visible as separate CI checks so
    # a failure names the violated invariant directly in the checks list.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install dependencies
        run: |
          bun pm cache rm || true
          bun install --frozen-lockfile


      - name: Check host isolation
        run: cd packages/protocol && bun run architecture:host-isolation

      - name: Check capability boundaries
        run: cd packages/protocol && bun run architecture:capabilities

      - name: Run architecture tests
        run: cd packages/protocol && bun run test:architecture
