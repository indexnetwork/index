name: Protected macOS production release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      operation:
        description: Create a private candidate, or publish an existing approved candidate
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - publish
      tag:
        description: Exact annotated production tag (v1.0.0)
        required: true
        type: string
      commit:
        description: Exact full lowercase tagged commit SHA
        required: true
        type: string
      build-number:
        description: Strictly increasing positive build number
        required: true
        type: string
      candidate-run-id:
        description: Candidate workflow run ID (publish only)
        required: false
        type: string
      candidate-run-attempt:
        description: Candidate workflow run attempt (publish only)
        required: false
        type: string
      arm64-evidence:
        description: Base64 canonical arm64 clean-account JSON (publish only)
        required: false
        type: string
      arm64-evidence-cms:
        description: Base64 detached-authority arm64 approval CMS (publish only)
        required: false
        type: string
      x86_64-evidence:
        description: Base64 canonical x86_64 clean-account JSON (publish only)
        required: false
        type: string
      x86_64-evidence-cms:
        description: Base64 detached-authority x86_64 approval CMS (publish only)
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: macos-production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' || inputs.operation != 'publish'
    environment: macos-production
    runs-on: macos-14
    timeout-minutes: 180
    env:
      INDEX_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      INDEX_RELEASE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.sha }}
      INDEX_BUILD_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs['build-number'] || vars.INDEX_RELEASE_BUILD_NUMBER }}
      INDEX_RELEASE_VERSION: "1.0.0"
      INDEX_API_URL: https://protocol.index.network
      INDEX_WEB_URL: https://index.network
      INDEX_EXPECTED_TEAM_ID: LMQ3XNXLAD
      INDEX_CONNECTOR_PROTOCOL_VERSION: "1"
      INDEX_RELEASE_MACOS_VERSION: ${{ vars.INDEX_RELEASE_EXPECTED_MACOS_VERSION }}
      INDEX_RELEASE_MACOS_BUILD: ${{ vars.INDEX_RELEASE_EXPECTED_MACOS_BUILD }}
      INDEX_RELEASE_EXPECTED_MACOS_VERSION: ${{ vars.INDEX_RELEASE_EXPECTED_MACOS_VERSION }}
      INDEX_RELEASE_EXPECTED_MACOS_BUILD: ${{ vars.INDEX_RELEASE_EXPECTED_MACOS_BUILD }}
      INDEX_RELEASE_EXPECTED_RUNNER_IMAGE: ${{ vars.INDEX_RELEASE_EXPECTED_RUNNER_IMAGE }}
      INDEX_RELEASE_EXPECTED_RUNNER_VERSION: ${{ vars.INDEX_RELEASE_EXPECTED_RUNNER_VERSION }}
      INDEX_RELEASE_CMS_IDENTITY_HASH: ${{ vars.INDEX_RELEASE_CMS_IDENTITY_HASH }}
      INDEX_RELEASE_CMS_CERT_SHA256: ${{ vars.INDEX_RELEASE_CMS_CERT_SHA256 }}
      INDEX_RELEASE_TAG_RULESET_ID: ${{ vars.INDEX_RELEASE_TAG_RULESET_ID }}
      INDEX_RELEASE_PROCESS_ALLOWLIST_SHA256: ${{ vars.INDEX_RELEASE_PROCESS_ALLOWLIST_SHA256 }}
      INDEX_RELEASE_RUNNER_LISTENER_PATH: ${{ vars.INDEX_RELEASE_RUNNER_LISTENER_PATH }}
      INDEX_RELEASE_RUNNER_LISTENER_SHA256: ${{ vars.INDEX_RELEASE_RUNNER_LISTENER_SHA256 }}
      INDEX_RELEASE_RUNNER_WORKER_PATH: ${{ vars.INDEX_RELEASE_RUNNER_WORKER_PATH }}
      INDEX_RELEASE_RUNNER_WORKER_SHA256: ${{ vars.INDEX_RELEASE_RUNNER_WORKER_SHA256 }}
    steps:
      - name: Checkout the exact release commit once without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.20"

      - name: Prepare credential-free build handoff
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          INDEX_RELEASE_WORK_ROOT: ${{ runner.temp }}/index-production-${{ github.run_id }}-${{ github.run_attempt }}
        run: apps/mac/release/build-release.sh prepare

      - name: Authorize remote tag rules and prior releases
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          INDEX_RELEASE_WORK_ROOT: ${{ runner.temp }}/index-production-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          cat <<'PINS' | /usr/bin/shasum -a 256 -c -
          cf1faf8f1c366c40c24b70599afc9a0e06c1fc7e6e0b7c1d5c1763cf1418fd78  apps/mac/release/build-release.sh
          5662639d841785123b3c890254a78f5399b3933a671777f45872bf1b29f304ac  apps/mac/release/sealed-inventory.py
          94e9a4997328e557a325a105580cbeafc10f751fb6b152b8cea2d21fcbc986b6  apps/mac/release/verify-tag-ruleset.mjs
          c5736c503ab9d7db093fa4e7673b7e35f876f5519979cddeffc1a3a29a471f7f  apps/mac/release/process-isolation.py
          fb04addf3b1f2b4ecd820cad6fd141e346f23f86efb9e5ed7bc2c71192db4a31  apps/mac/release/verify-prior-release-metadata.sh
          PINS
          /usr/bin/git diff-index --quiet "$GITHUB_SHA" --
          apps/mac/release/build-release.sh authorize

      - name: Build protected signed and notarized candidate
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          INDEX_RELEASE_WORK_ROOT: ${{ runner.temp }}/index-production-${{ github.run_id }}-${{ github.run_attempt }}
          INDEX_DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.INDEX_DEVELOPER_ID_CERTIFICATE_P12 }}
          INDEX_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.INDEX_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          INDEX_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.INDEX_APP_PROVISIONING_PROFILE_BASE64 }}
          INDEX_CONNECTOR_PROVISIONING_PROFILE_BASE64: ${{ secrets.INDEX_CONNECTOR_PROVISIONING_PROFILE_BASE64 }}
          INDEX_NOTARY_API_KEY_BASE64: ${{ secrets.INDEX_NOTARY_API_KEY_BASE64 }}
          INDEX_NOTARY_KEY_ID: ${{ secrets.INDEX_NOTARY_KEY_ID }}
          INDEX_NOTARY_ISSUER_ID: ${{ secrets.INDEX_NOTARY_ISSUER_ID }}
        run: |
          cat <<'PINS' | /usr/bin/shasum -a 256 -c -
          cf1faf8f1c366c40c24b70599afc9a0e06c1fc7e6e0b7c1d5c1763cf1418fd78  apps/mac/release/build-release.sh
          5662639d841785123b3c890254a78f5399b3933a671777f45872bf1b29f304ac  apps/mac/release/sealed-inventory.py
          94e9a4997328e557a325a105580cbeafc10f751fb6b152b8cea2d21fcbc986b6  apps/mac/release/verify-tag-ruleset.mjs
          c5736c503ab9d7db093fa4e7673b7e35f876f5519979cddeffc1a3a29a471f7f  apps/mac/release/process-isolation.py
          fb04addf3b1f2b4ecd820cad6fd141e346f23f86efb9e5ed7bc2c71192db4a31  apps/mac/release/verify-prior-release-metadata.sh
          PINS
          /usr/bin/git diff-index --quiet "$GITHUB_SHA" --
          apps/mac/release/build-release.sh candidate

      - name: Verify sealed connector plugin handoff
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          INDEX_RELEASE_WORK_ROOT: ${{ runner.temp }}/index-production-${{ github.run_id }}-${{ github.run_attempt }}
        run: apps/mac/release/build-release.sh verify-plugin-handoff

      # This private one-day handoff is intentionally not a GitHub Release asset.
      # Release/security operators must review the exact CMS and digest, then
      # commit both the CMS bytes and the matching plugin pin in a separate PR.
      - name: Upload private connector plugin handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: connector-plugin-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/index-production-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/plugin-handoff/connector-release.cms
            ${{ runner.temp }}/index-production-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/plugin-handoff/connector-release.cms.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Attest the exact immutable publication asset set
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            ${{ runner.temp }}/index-production-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/candidate/Index-macOS-1.0.0-universal.dmg
            ${{ runner.temp }}/index-production-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/candidate/IndexConnector-1.0.0-universal.dmg
            ${{ runner.temp }}/index-production-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/candidate/macos-release.json
            ${{ runner.temp }}/index-production-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/candidate/macos-release.cms
            ${{ runner.temp }}/index-production-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/candidate/SHA256SUMS

      - name: Bind successful attestation to the sealed candidate
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          INDEX_RELEASE_WORK_ROOT: ${{ runner.temp }}/index-production-${{ github.run_id }}-${{ github.run_attempt }}
          INDEX_ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: apps/mac/release/build-release.sh record-attestation "$INDEX_ATTESTATION_URL"

      - name: Seal exact private candidate handoff
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          INDEX_RELEASE_WORK_ROOT: ${{ runner.temp }}/index-production-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          bun apps/mac/release/candidate-handoff.ts create \
            "$INDEX_RELEASE_WORK_ROOT/artifacts/candidate" \
            "$INDEX_RELEASE_WORK_ROOT/authority/state/attestation.complete" \
            "$INDEX_RELEASE_WORK_ROOT/artifacts/private-candidate-handoff" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

      # Immutable Actions artifact only: this job has no public release command.
      - name: Upload private immutable candidate handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-private-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/index-production-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/private-candidate-handoff
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish'
    environment: macos-production
    runs-on: macos-14
    timeout-minutes: 45
    env:
      INDEX_RELEASE_TAG: ${{ inputs.tag }}
      INDEX_RELEASE_COMMIT: ${{ inputs.commit }}
      INDEX_RELEASE_PUBLISH_WORKFLOW_SHA: ${{ github.sha }}
      INDEX_RELEASE_CANDIDATE_RUN_ID: ${{ inputs['candidate-run-id'] }}
      INDEX_RELEASE_CANDIDATE_RUN_ATTEMPT: ${{ inputs['candidate-run-attempt'] }}
      INDEX_BUILD_NUMBER: ${{ inputs['build-number'] }}
      INDEX_RELEASE_VERSION: "1.0.0"
      INDEX_API_URL: https://protocol.index.network
      INDEX_WEB_URL: https://index.network
      INDEX_EXPECTED_TEAM_ID: LMQ3XNXLAD
      INDEX_CONNECTOR_PROTOCOL_VERSION: "1"
      INDEX_RELEASE_MACOS_VERSION: ${{ vars.INDEX_RELEASE_EXPECTED_MACOS_VERSION }}
      INDEX_RELEASE_MACOS_BUILD: ${{ vars.INDEX_RELEASE_EXPECTED_MACOS_BUILD }}
      INDEX_RELEASE_EXPECTED_MACOS_VERSION: ${{ vars.INDEX_RELEASE_EXPECTED_MACOS_VERSION }}
      INDEX_RELEASE_EXPECTED_MACOS_BUILD: ${{ vars.INDEX_RELEASE_EXPECTED_MACOS_BUILD }}
      INDEX_RELEASE_EXPECTED_RUNNER_IMAGE: ${{ vars.INDEX_RELEASE_EXPECTED_RUNNER_IMAGE }}
      INDEX_RELEASE_EXPECTED_RUNNER_VERSION: ${{ vars.INDEX_RELEASE_EXPECTED_RUNNER_VERSION }}
      INDEX_RELEASE_CMS_IDENTITY_HASH: ${{ vars.INDEX_RELEASE_CMS_IDENTITY_HASH }}
      INDEX_RELEASE_CMS_CERT_SHA256: ${{ vars.INDEX_RELEASE_CMS_CERT_SHA256 }}
      INDEX_RELEASE_TAG_RULESET_ID: ${{ vars.INDEX_RELEASE_TAG_RULESET_ID }}
      INDEX_RELEASE_PROCESS_ALLOWLIST_SHA256: ${{ vars.INDEX_RELEASE_PROCESS_ALLOWLIST_SHA256 }}
      INDEX_RELEASE_RUNNER_LISTENER_PATH: ${{ vars.INDEX_RELEASE_RUNNER_LISTENER_PATH }}
      INDEX_RELEASE_RUNNER_LISTENER_SHA256: ${{ vars.INDEX_RELEASE_RUNNER_LISTENER_SHA256 }}
      INDEX_RELEASE_RUNNER_WORKER_PATH: ${{ vars.INDEX_RELEASE_RUNNER_WORKER_PATH }}
      INDEX_RELEASE_RUNNER_WORKER_SHA256: ${{ vars.INDEX_RELEASE_RUNNER_WORKER_SHA256 }}
      INDEX_RELEASE_APPROVAL_CERT_SHA256_ARM64: ${{ vars.INDEX_RELEASE_APPROVAL_CERT_SHA256_ARM64 }}
      INDEX_RELEASE_APPROVAL_CERT_SHA256_X86_64: ${{ vars.INDEX_RELEASE_APPROVAL_CERT_SHA256_X86_64 }}
    steps:
      - name: Checkout exact approved candidate commit without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.20"

      - name: Download exact private candidate bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-private-candidate-${{ inputs['candidate-run-id'] }}-${{ inputs['candidate-run-attempt'] }}
          path: ${{ runner.temp }}/index-production-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/private-candidate-handoff
          repository: ${{ github.repository }}
          run-id: ${{ inputs['candidate-run-id'] }}
          github-token: ${{ github.token }}

      - name: Materialize approved two-architecture evidence without logging it
        env:
          INDEX_ARM64_EVIDENCE_BASE64: ${{ inputs['arm64-evidence'] }}
          INDEX_ARM64_EVIDENCE_CMS_BASE64: ${{ inputs['arm64-evidence-cms'] }}
          INDEX_X86_64_EVIDENCE_BASE64: ${{ inputs['x86_64-evidence'] }}
          INDEX_X86_64_EVIDENCE_CMS_BASE64: ${{ inputs['x86_64-evidence-cms'] }}
          INDEX_RELEASE_WORK_ROOT: ${{ runner.temp }}/index-production-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set +x
          umask 077
          mkdir -p "$INDEX_RELEASE_WORK_ROOT/authority/evidence"
          printf '%s' "$INDEX_ARM64_EVIDENCE_BASE64" | bun -e 'process.stdout.write(Buffer.from(await Bun.stdin.text(), "base64"))' > "$INDEX_RELEASE_WORK_ROOT/authority/evidence/arm64.json"
          printf '%s' "$INDEX_ARM64_EVIDENCE_CMS_BASE64" | bun -e 'process.stdout.write(Buffer.from(await Bun.stdin.text(), "base64"))' > "$INDEX_RELEASE_WORK_ROOT/authority/evidence/arm64.cms"
          printf '%s' "$INDEX_X86_64_EVIDENCE_BASE64" | bun -e 'process.stdout.write(Buffer.from(await Bun.stdin.text(), "base64"))' > "$INDEX_RELEASE_WORK_ROOT/authority/evidence/x86_64.json"
          printf '%s' "$INDEX_X86_64_EVIDENCE_CMS_BASE64" | bun -e 'process.stdout.write(Buffer.from(await Bun.stdin.text(), "base64"))' > "$INDEX_RELEASE_WORK_ROOT/authority/evidence/x86_64.cms"
          bun apps/mac/release/verify-clean-account-evidence.ts --pair \
            "$INDEX_RELEASE_WORK_ROOT/authority/evidence/arm64.json" "$INDEX_RELEASE_WORK_ROOT/authority/evidence/arm64.cms" \
            "$INDEX_RELEASE_WORK_ROOT/authority/evidence/x86_64.json" "$INDEX_RELEASE_WORK_ROOT/authority/evidence/x86_64.cms"

      - name: Revalidate exact candidate, evidence, attestation, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          INDEX_RELEASE_WORK_ROOT: ${{ runner.temp }}/index-production-${{ github.run_id }}-${{ github.run_attempt }}
          INDEX_ARM64_EVIDENCE_PATH: ${{ runner.temp }}/index-production-${{ github.run_id }}-${{ github.run_attempt }}/authority/evidence/arm64.json
          INDEX_ARM64_EVIDENCE_CMS_PATH: ${{ runner.temp }}/index-production-${{ github.run_id }}-${{ github.run_attempt }}/authority/evidence/arm64.cms
          INDEX_X86_64_EVIDENCE_PATH: ${{ runner.temp }}/index-production-${{ github.run_id }}-${{ github.run_attempt }}/authority/evidence/x86_64.json
          INDEX_X86_64_EVIDENCE_CMS_PATH: ${{ runner.temp }}/index-production-${{ github.run_id }}-${{ github.run_attempt }}/authority/evidence/x86_64.cms
        run: |
          cat <<'PINS' | /usr/bin/shasum -a 256 -c -
          cf1faf8f1c366c40c24b70599afc9a0e06c1fc7e6e0b7c1d5c1763cf1418fd78  apps/mac/release/build-release.sh
          5662639d841785123b3c890254a78f5399b3933a671777f45872bf1b29f304ac  apps/mac/release/sealed-inventory.py
          94e9a4997328e557a325a105580cbeafc10f751fb6b152b8cea2d21fcbc986b6  apps/mac/release/verify-tag-ruleset.mjs
          c5736c503ab9d7db093fa4e7673b7e35f876f5519979cddeffc1a3a29a471f7f  apps/mac/release/process-isolation.py
          fb04addf3b1f2b4ecd820cad6fd141e346f23f86efb9e5ed7bc2c71192db4a31  apps/mac/release/verify-prior-release-metadata.sh
          PINS
          /usr/bin/git diff-index --quiet "$INDEX_RELEASE_COMMIT" --
          apps/mac/release/build-release.sh publish

      - name: Prove exact release absence after pre-publication failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          INDEX_RELEASE_WORK_ROOT: ${{ runner.temp }}/index-production-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          cat <<'PINS' | /usr/bin/shasum -a 256 -c -
          cf1faf8f1c366c40c24b70599afc9a0e06c1fc7e6e0b7c1d5c1763cf1418fd78  apps/mac/release/build-release.sh
          PINS
          /usr/bin/git diff-index --quiet "$INDEX_RELEASE_COMMIT" --
          apps/mac/release/build-release.sh assert-absence
