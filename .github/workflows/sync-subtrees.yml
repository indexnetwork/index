# Syncs subtree-tracked packages to their canonical repos when dev/main moves.
#
# Replaces the local scripts/hooks/pre-push subtree push. Triggered by direct
# pushes and PR merges (squash, rebase, or merge-commit) into dev/main.
#
# Squash/rebase merges produce diverging split histories between dev and main,
# so the push uses --force-with-lease. Subtree repos are treated as derived
# artifacts; their branches may be force-updated.
name: Sync subtrees

on:
  push:
    branches: [dev, main]
  workflow_dispatch:  # Manual re-run, e.g. after fixing CI auth

concurrency:
  # Serialize per-branch so two pushes can't race on the same subtree branch.
  group: sync-subtrees-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'indexnetwork/index'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - prefix: packages/protocol
            repo: indexnetwork/protocol
          - prefix: packages/cli
            repo: indexnetwork/cli
          - prefix: packages/claude-plugin
            repo: indexnetwork/claude-plugin
          - prefix: packages/agentvillage
            repo: indexnetwork/agentvillage
            ignore_joins: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # subtree split walks full history
          # Don't persist GITHUB_TOKEN as a git credential — we authenticate
          # the push with SUBTREE_SYNC_PAT embedded in the remote URL, and
          # the persisted extraheader would otherwise override it.
          persist-credentials: false

      - name: Skip if prefix untouched
        id: gate
        run: |
          set -euo pipefail
          SOURCE_BRANCH="${{ matrix.source_branch || '' }}"
          if [ -n "$SOURCE_BRANCH" ] && [ "$GITHUB_REF_NAME" != "$SOURCE_BRANCH" ]; then
            echo "${{ matrix.prefix }} syncs only from $SOURCE_BRANCH — skipping $GITHUB_REF_NAME."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "First push on this branch — running."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$BEFORE" "${{ github.sha }}" -- "${{ matrix.prefix }}"; then
            echo "No changes in ${{ matrix.prefix }} since $BEFORE — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected in ${{ matrix.prefix }} — running."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync fork from upstream
        if: steps.gate.outputs.run == 'true' && matrix.upstream_repo != ''
        env:
          GH_TOKEN: ${{ secrets.SUBTREE_SYNC_PAT }}
        run: |
          set -euo pipefail
          echo "Syncing ${{ matrix.repo }} from ${{ matrix.upstream_repo }}..."
          gh repo sync "${{ matrix.repo }}" \
            --source "${{ matrix.upstream_repo }}" \
            --branch "${{ matrix.target_branch || github.ref_name }}" \
            --force
          echo "✓ fork synced"

      - name: Split and push
        if: steps.gate.outputs.run == 'true'
        env:
          GH_PAT: ${{ secrets.SUBTREE_SYNC_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_PAT:-}" ]; then
            echo "❌ SUBTREE_SYNC_PAT secret is not set."
            exit 1
          fi
          BRANCH="${GITHUB_REF_NAME}"
          TARGET_BRANCH="${{ matrix.target_branch || '' }}"
          if [ -z "$TARGET_BRANCH" ]; then
            TARGET_BRANCH="$BRANCH"
          fi
          SPLIT_FLAGS=""
          IGNORE_JOINS="${{ matrix.ignore_joins || 'false' }}"
          if [ "$IGNORE_JOINS" = "true" ]; then
            SPLIT_FLAGS="--ignore-joins"
            echo "Using --ignore-joins (squash-pull annotations may reference unreachable commits)"
          else
            # For one-way subtrees, fetch the target branch so any prior
            # split annotations are reachable as an optimization boundary.
            echo "Fetching ${{ matrix.repo }}#${TARGET_BRANCH} for split-SHA reachability..."
            git fetch --no-tags \
              "https://x-access-token:${GH_PAT}@github.com/${{ matrix.repo }}.git" \
              "$TARGET_BRANCH" 2>/dev/null \
              || echo "note: fetch failed (subtree repo or branch may not exist yet); continuing"
          fi
          echo "Splitting ${{ matrix.prefix }} on $BRANCH..."
          SPLIT_SHA=$(git subtree split $SPLIT_FLAGS --prefix="${{ matrix.prefix }}" "$BRANCH")
          echo "Split SHA: $SPLIT_SHA"
          # Plain --force (not --force-with-lease): the subtree repo is a
          # derived artifact this workflow owns end-to-end, and we serialize
          # writes per branch via the concurrency group above. We have no
          # remote-tracking ref for the subtree repo, so --force-with-lease
          # cannot validate and rejects with "stale info" whenever the split
          # history diverges (always the case after squash/rebase merges).
          git push --force \
            "https://x-access-token:${GH_PAT}@github.com/${{ matrix.repo }}.git" \
            "${SPLIT_SHA}:refs/heads/${TARGET_BRANCH}"
          echo "✓ pushed to ${{ matrix.repo }} ($TARGET_BRANCH)"
