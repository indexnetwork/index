# Compiles the macOS app so Swift breakage is caught in CI instead of at the
# next developer's `./build.sh`.
#
# apps/mac is a WKWebView shell whose Swift sources import Cocoa and
# WebKit — Apple-only frameworks, so this is the only place in the pipeline
# that can compile them. Everything else in this repo runs on Linux runners,
# which means main.swift was previously verified by review alone.
#
# Scoped to apps/mac changes (plus manual dispatch) to keep macOS runner
# minutes, which bill at a higher rate than Linux, proportionate to the risk.
name: Build macOS app

permissions:
  contents: read

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "apps/mac/**"
      - ".github/workflows/mac-app-build.yml"
  workflow_dispatch:

concurrency:
  group: mac-app-build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.20"

      - name: Install frozen test dependencies
        run: bun install --frozen-lockfile

      - name: Show toolchain
        run: |
          sw_vers
          swiftc --version
          python3 --version

      - name: Provider-free Mac runtime and deep-link tests
        working-directory: apps/mac
        run: |
          # Keep this macOS compile workflow dependency-free. React/happy-dom
          # render tests and the protocol-composed acceptance run in the
          # frozen-install Hermes security workflow on Linux.
          bun test \
            api/agent-runtime.spec.mjs \
            api/agent-runtime-saga.spec.mjs \
            api/intent-intake-ui.spec.mjs \
            api/client.spec.mjs \
            api/deeplink.spec.mjs \
            IndexConnector/connector-contract.spec.mjs

      - name: Native connector authorization, transport, protocol, and Keychain fixtures
        working-directory: apps/mac/IndexConnector
        run: |
          bash -n build.sh
          plutil -lint Info.plist IndexConnector.entitlements
          ./build.sh --fixture ConnectorProtocolFixture
          ./build.sh --fixture KeychainIntegrationFixture
          ./build.sh --fixture AuthorizationFixture
          ./build.sh --fixture TransportFixture
          ./build.sh --fixture InstallationStoreMultiprocessFixture
          ./build.sh
          test -x dist/IndexConnector.app/Contents/MacOS/IndexConnector

      - name: Protected signed cross-identity Keychain fixture
        if: github.event_name == 'workflow_dispatch'
        working-directory: apps/mac/IndexConnector
        env:
          INDEX_KEYCHAIN_SIGNING_FIXTURE: ${{ secrets.INDEX_KEYCHAIN_SIGNING_FIXTURE }}
          INDEX_APP_IDENTIFIER_PREFIX: ${{ secrets.INDEX_APP_IDENTIFIER_PREFIX }}
          INDEX_TEST_APP_KEYCHAIN_GROUP: ${{ secrets.INDEX_TEST_APP_KEYCHAIN_GROUP }}
          INDEX_TEST_CONNECTOR_KEYCHAIN_GROUP: ${{ secrets.INDEX_TEST_CONNECTOR_KEYCHAIN_GROUP }}
          INDEX_TEST_APP_CODESIGN_IDENTITY: ${{ secrets.INDEX_TEST_APP_CODESIGN_IDENTITY }}
          INDEX_TEST_CONNECTOR_CODESIGN_IDENTITY: ${{ secrets.INDEX_TEST_CONNECTOR_CODESIGN_IDENTITY }}
          INDEX_TEST_APP_PROVISIONING_PROFILE: ${{ secrets.INDEX_TEST_APP_PROVISIONING_PROFILE }}
          INDEX_TEST_CONNECTOR_PROVISIONING_PROFILE: ${{ secrets.INDEX_TEST_CONNECTOR_PROVISIONING_PROFILE }}
        run: |
          if [ "${INDEX_KEYCHAIN_SIGNING_FIXTURE:-}" != "1" ]; then
            echo "Protected signed Keychain fixture skipped (set INDEX_KEYCHAIN_SIGNING_FIXTURE=1 to enable)."
            exit 0
          fi
          ./build.sh --signed-access-fixture

      - name: macOS shell and handoff tests
        run: |
          # GitHub's /var -> /private/var alias makes strict physical-path
          # release fixtures reject the default TMPDIR before testing their
          # intended contract. Canonicalize it without weakening source checks.
          TMPDIR="$(python3 -c 'import os, tempfile; print(os.path.realpath(tempfile.gettempdir()))')"
          export TMPDIR
          bun test \
            apps/mac/scripts/*.spec.mjs \
            apps/mac/*.spec.mjs \
            apps/mac/release/tests/*.spec.mjs
          # release-workflow.spec.mjs is included by the release test glob.
          bash -n \
            apps/mac/scripts/build.sh \
            apps/mac/scripts/link-host.sh \
            apps/mac/scripts/provisioning-profile.sh \
            apps/mac/scripts/notarize.sh \
            apps/mac/IndexConnector/build.sh \
            apps/mac/release/release-config.sh \
            apps/mac/release/notarize-bundle.sh \
            apps/mac/release/create-dmg.sh \
            apps/mac/release/notarize-dmg.sh \
            apps/mac/release/verify-mounted-dmg.sh \
            apps/mac/release/sign-release-metadata.sh \
            apps/mac/release/verify-release-metadata.sh \
            apps/mac/release/verify-prior-release-metadata.sh \
            apps/mac/release/build-release-isolation-guard.sh \
            apps/mac/release/build-release.sh \
            apps/mac/scripts/dmg.sh
          python3 -m py_compile \
            apps/mac/release/process-isolation.py \
            apps/mac/release/sealed-inventory.py

      - name: Native owner credential migration and Keychain failure fixture
        working-directory: apps/mac
        run: ./scripts/build.sh --fixture OwnerCredentialMigrationFixture

      - name: Native incremental SSE delegate and typed-body fixtures
        working-directory: apps/mac
        run: |
          ./scripts/build.sh --fixture NativeAPIStreamDelegateFixture
          ./scripts/build.sh --fixture NativeAPIBodyValidationFixture
          ./scripts/build.sh --fixture NativeAPIQuarantineFixture

      - name: Native suspended connector launch attestation
        working-directory: apps/mac
        run: ./scripts/build.sh --fixture ConnectorLaunchAttestationFixture

      - name: Native historical Hermes persistence compatibility
        working-directory: apps/mac
        run: |
          swiftc -parse-as-library -framework Security \
            Sources/ConnectorLaunchAttestation.swift \
            Sources/HermesRuntime.swift \
            Tests/HermesPersistenceCompatibility.swift \
            -o "$RUNNER_TEMP/hermes-persistence-compatibility"
          "$RUNNER_TEMP/hermes-persistence-compatibility"

      - name: Assemble web layer
        working-directory: apps/mac
        run: python3 scripts/assemble.py

      - name: Fail if the committed bundle is stale
        run: |
          if ! git diff --quiet -- apps/mac/Resources/index.html; then
            echo "::error::Resources/index.html is out of date — run apps/mac/scripts/assemble.py and commit the result."
            git diff --stat -- apps/mac/Resources/index.html
            exit 1
          fi

      - name: Build and sign the app bundle
        working-directory: apps/mac
        run: ./scripts/build.sh

      - name: Verify bundle, URL scheme, and entitlements
        working-directory: apps/mac
        run: |
          set -euo pipefail
          test -x dist/Index.app/Contents/MacOS/Index
          plutil -lint dist/Index.app/Contents/Info.plist
          echo "--- registered URL schemes:"
          plutil -extract CFBundleURLTypes json -o - dist/Index.app/Contents/Info.plist
          echo "--- signature:"
          codesign -dvv dist/Index.app 2>&1 | sed -n '1,12p'
          echo "--- entitlements actually applied (empty means the ad-hoc retry dropped them):"
          codesign -d --entitlements :- dist/Index.app 2>&1 | sed -n '1,20p'

  # This PR-safe job deliberately has no environment protection and no secret
  # references. It proves the real cross-architecture build using ad-hoc signing.
  # Every output is development-only and is never a production release candidate.
  universal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.20"

      - name: Universal build contract and shell syntax
        run: |
          bun test apps/mac/release/tests/universal-build-contract.spec.mjs
          bash -n \
            apps/mac/scripts/build.sh \
            apps/mac/IndexConnector/build.sh \
            apps/mac/release/release-config.sh \
            apps/mac/release/build-universal.sh

      - name: Assemble web layer for Universal 2 bundle
        working-directory: apps/mac
        run: python3 scripts/assemble.py

      - name: Build unsigned Universal 2 production bundles (development-only evidence)
        env:
          INDEX_RELEASE_VERSION: "1.0.0"
          INDEX_BUILD_NUMBER: ${{ github.event.pull_request.number || github.run_number }}
          INDEX_RELEASE_COMMIT: ${{ github.sha }}
          INDEX_API_URL: https://protocol.index.network
          INDEX_WEB_URL: https://index.network
          INDEX_EXPECTED_TEAM_ID: LMQ3XNXLAD
          INDEX_CONNECTOR_PROTOCOL_VERSION: "1"
        run: apps/mac/release/build-universal.sh

      - name: Verify unsigned Universal 2 production bundles
        run: |
          set -euo pipefail
          app_binary=apps/mac/dist/unsigned/Index.app/Contents/MacOS/Index
          connector_binary=apps/mac/dist/unsigned/IndexConnector.app/Contents/MacOS/IndexConnector
          lipo -archs apps/mac/dist/unsigned/Index.app/Contents/MacOS/Index
          lipo -archs apps/mac/dist/unsigned/IndexConnector.app/Contents/MacOS/IndexConnector
          for binary in "$app_binary" "$connector_binary"; do
            archs="$(lipo -archs "$binary")"
            [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]]
            [[ "$(wc -w <<<"$archs" | tr -d ' ')" == "2" ]]
            for arch in arm64 x86_64; do
              otool -arch "$arch" -l "$binary" | grep -A6 LC_BUILD_VERSION
              [[ "$(otool -arch "$arch" -l "$binary" | awk '/LC_BUILD_VERSION/{seen=1; next} seen && $1=="minos" {print $2; exit}')" == "13.0" ]]
              xcrun otool -arch "$arch" -X -s __TEXT __indexcfg "$binary"
            done
          done
          plutil -extract IndexReleaseChannel raw -o - apps/mac/dist/unsigned/Index.app/Contents/Info.plist | grep -Fx production
          plutil -extract IndexDevelopmentBuild raw -o - apps/mac/dist/unsigned/Index.app/Contents/Info.plist | grep -Fx false
          plutil -extract IndexReleaseChannel raw -o - apps/mac/dist/unsigned/IndexConnector.app/Contents/Info.plist | grep -Fx production
          plutil -extract IndexDevelopmentBuild raw -o - apps/mac/dist/unsigned/IndexConnector.app/Contents/Info.plist | grep -Fx false
