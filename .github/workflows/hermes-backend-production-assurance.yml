name: Hermes backend production assurance

on:
  pull_request:
    branches: [dev, main, feat/hermes-secure-standalone-connect]
    paths:
      - "services/api/**"
      - "packages/protocol/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/hermes-backend-production-assurance.yml"
  workflow_dispatch:
    inputs:
      PREVIOUS_API_IMAGE:
        description: "Release-ops supplied immutable digest of the currently deployed API image (repository@sha256:...)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  previous-api-pr-base-evidence:
    name: Non-production PR rollback-base API evidence
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hermes_assurance
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d hermes_assurance"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install frozen current dependencies
        run: |
          bun pm cache rm || true
          bun install --frozen-lockfile

      - name: Install pgvector in exact PostgreSQL service
        env:
          POSTGRES_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$POSTGRES_SERVICE_CONTAINER"
          test "$(docker inspect --format '{{.Config.Image}}' "$POSTGRES_SERVICE_CONTAINER")" = "postgres:16"
          docker exec --user root "$POSTGRES_SERVICE_CONTAINER" bash -ceu '
            apt-get update
            apt-get install -y --no-install-recommends postgresql-16-pgvector
            rm -rf /var/lib/apt/lists/*
          '
          docker exec "$POSTGRES_SERVICE_CONTAINER" \
            psql --username postgres --dbname hermes_assurance \
              --no-psqlrc --tuples-only --no-align \
              --command "SELECT 1 FROM pg_available_extensions WHERE name = 'vector'" \
            | grep -qx 1

      - name: Migrate disposable compatibility database
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hermes_assurance
          TEST_DATABASE_SAFE: "1"
        run: bun run --cwd services/api db:migrate:test

      - name: Derive and export approved rollback base
        id: rollback_base
        env:
          EXPECTED_ROLLBACK_BASE_SHA: 751f5a7ed143150488543db9a1b4ee1f1b833bfc
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/feat/hermes-secure-standalone-connect:refs/remotes/origin/feat/hermes-secure-standalone-connect
          derived_base_sha="$(git merge-base origin/main origin/feat/hermes-secure-standalone-connect)"
          test "$derived_base_sha" = "$EXPECTED_ROLLBACK_BASE_SHA"
          test "$(git cat-file -t "$derived_base_sha")" = commit
          git merge-base --is-ancestor "$derived_base_sha" "$GITHUB_SHA"
          base_dir="$RUNNER_TEMP/hermes-rollback-base"
          rm -rf "$base_dir"
          mkdir -p "$base_dir"
          git archive "$derived_base_sha" | tar -x -C "$base_dir"
          printf 'base_sha=%s\nbase_dir=%s\n' "$derived_base_sha" "$base_dir" >>"$GITHUB_OUTPUT"

      - name: Build real rollback-base API production image
        id: rollback_image
        env:
          BASE_SHA: ${{ steps.rollback_base.outputs.base_sha }}
          BASE_DIR: ${{ steps.rollback_base.outputs.base_dir }}
        run: |
          set -euo pipefail
          image_tag="index-api-rollback-base:${BASE_SHA}"
          docker build \
            --file services/api/src/cli/tests/fixtures/previous-api-base.Dockerfile \
            --tag "$image_tag" \
            "$BASE_DIR"
          image_id="$(docker inspect --format='{{.Id}}' "$image_tag")"
          test -n "$image_id"
          printf 'image_id=%s\n' "$image_id" >>"$GITHUB_OUTPUT"
          printf '### Non-production rollback-base compatibility evidence\n- Base SHA: `%s`\n- Local image ID: `%s`\n' \
            "$BASE_SHA" "$image_id" >>"$GITHUB_STEP_SUMMARY"

      - name: Record non-production rollback-base denial
        env:
          NODE_ENV: test
          ALLOW_MUTABLE_PREVIOUS_IMAGE: "1"
          PREVIOUS_API_IMAGE: ${{ steps.rollback_image.outputs.image_id }}
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hermes_assurance
          TEST_DATABASE_SAFE: "1"
          HERMES_PREVIOUS_API_REPORT: previous-api-compatibility-base-${{ steps.rollback_base.outputs.base_sha }}.json
          HERMES_PREVIOUS_API_DIAGNOSTIC: previous-api-compatibility-diagnostic.json
        run: bun run --cwd services/api verify:hermes-previous-api-compatibility

      - name: Upload previous API compatibility diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: previous-api-compatibility-diagnostic
          path: services/api/previous-api-compatibility-diagnostic.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload non-production rollback-base compatibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: non-production-previous-api-base-${{ steps.rollback_base.outputs.base_sha }}
          path: services/api/previous-api-compatibility-base-${{ steps.rollback_base.outputs.base_sha }}.json
          if-no-files-found: error
          retention-days: 14

  disposable-postgres-assurance:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hermes_assurance
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d hermes_assurance"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install frozen dependencies
        run: |
          bun pm cache rm || true
          bun install --frozen-lockfile

      - name: Build protocol package
        run: bun run --cwd packages/protocol build

      - name: Install pgvector in PostgreSQL service
        env:
          POSTGRES_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$POSTGRES_SERVICE_CONTAINER"
          test "$(docker inspect --format '{{.Config.Image}}' "$POSTGRES_SERVICE_CONTAINER")" = "postgres:16"
          docker exec --user root "$POSTGRES_SERVICE_CONTAINER" bash -ceu '
            apt-get update
            apt-get install -y --no-install-recommends postgresql-16-pgvector
            rm -rf /var/lib/apt/lists/*
          '
          docker exec "$POSTGRES_SERVICE_CONTAINER" \
            psql --username postgres --dbname hermes_assurance \
              --no-psqlrc --tuples-only --no-align \
              --command "SELECT 1 FROM pg_available_extensions WHERE name = 'vector'" \
            | grep -qx 1

      - name: Run Hermes production assurance
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hermes_assurance
          TEST_DATABASE_SAFE: "1"
          API_TEST_REQUIRE_DATABASE: "1"
        run: |
          bun run --cwd services/api db:migrate:test
          bun run --cwd services/api test:hermes-production-assurance

  previous-api-protected-compatibility:
    name: Protected currently-deployed API compatibility gate
    if: github.event_name == 'workflow_dispatch'
    environment: production
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hermes_assurance
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d hermes_assurance"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install frozen dependencies
        run: |
          bun pm cache rm || true
          bun install --frozen-lockfile

      - name: Install pgvector in exact PostgreSQL service
        env:
          POSTGRES_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$POSTGRES_SERVICE_CONTAINER"
          test "$(docker inspect --format '{{.Config.Image}}' "$POSTGRES_SERVICE_CONTAINER")" = "postgres:16"
          docker exec --user root "$POSTGRES_SERVICE_CONTAINER" bash -ceu '
            apt-get update
            apt-get install -y --no-install-recommends postgresql-16-pgvector
            rm -rf /var/lib/apt/lists/*
          '
          docker exec "$POSTGRES_SERVICE_CONTAINER" \
            psql --username postgres --dbname hermes_assurance \
              --no-psqlrc --tuples-only --no-align \
              --command "SELECT 1 FROM pg_available_extensions WHERE name = 'vector'" \
            | grep -qx 1

      - name: Migrate disposable compatibility database
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hermes_assurance
          TEST_DATABASE_SAFE: "1"
        run: bun run --cwd services/api db:migrate:test

      - name: Verify the release-ops supplied currently deployed image
        env:
          PREVIOUS_API_IMAGE: ${{ inputs.PREVIOUS_API_IMAGE }}
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hermes_assurance
          TEST_DATABASE_SAFE: "1"
          HERMES_PREVIOUS_API_REPORT: previous-api-compatibility-protected.json
          HERMES_PREVIOUS_API_DIAGNOSTIC: previous-api-compatibility-diagnostic.json
        run: bun run --cwd services/api verify:hermes-previous-api-compatibility

      - name: Upload previous API compatibility diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: previous-api-compatibility-diagnostic
          path: services/api/previous-api-compatibility-diagnostic.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload protected compatibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: protected-previous-api-compatibility-evidence
          path: services/api/previous-api-compatibility-protected.json
          if-no-files-found: error
          retention-days: 30
