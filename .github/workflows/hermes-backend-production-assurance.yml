name: Hermes backend production assurance

on:
  pull_request:
    branches: [dev, main, feat/hermes-secure-standalone-connect]
    paths:
      - "services/api/**"
      - "packages/protocol/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/hermes-backend-production-assurance.yml"
      - "apps/mac/api/agent-runtime-saga.mjs"
      - "apps/mac/api/agent-runtime-saga.spec.mjs"
      - "apps/mac/api/client.mjs"
      - "apps/mac/IndexConnector/Sources/ConnectorHTTPClient.swift"
      - "apps/mac/IndexConnector/Sources/ConnectorRuntime.swift"
      - "apps/mac/IndexApp/Sources/HermesRuntime.swift"
      - "docs/rollout/hermes-backend-production-assurance.md"
      - "docs/runbooks/hermes-emergency-rollback.md"
      - "docs/guides/development-reference.md"
      - "docs/superpowers/plans/2026-08-09-hermes-backend-production-assurance.md"
      - ".superpowers/sdd/2026-08-09-hermes-backend-production-assurance/task-7-report.md"
  workflow_dispatch:
    inputs:
      PREVIOUS_API_IMAGE:
        description: "Release-ops supplied immutable digest of the currently deployed API image (repository@sha256:...)"
        required: true
        type: string
      HERMES_PREFLIGHT_MAX_LOCK_MS:
        description: "Release-approved positive maximum preflight lock duration in milliseconds"
        required: true
        type: number
      HERMES_PREFLIGHT_MAX_TOTAL_MS:
        description: "Release-approved positive maximum total preflight duration in milliseconds"
        required: true
        type: number

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Reviewed together: the official PostgreSQL index digest resolves to a trixie
# amd64 image built after this archived PGDG package was published. The package
# SHA-256 was independently resolved from the signed PGDG Packages index and
# verified again from the version-pinned archive object bytes; no apt index
# participates in a run.
env:
  POSTGRES_ASSURANCE_REFERENCE: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
  PGVECTOR_PACKAGE_VERSION: 0.8.6-1.pgdg13+1
  PGVECTOR_EXTENSION_VERSION: 0.8.6
  PGVECTOR_PACKAGE_SHA256: 9aea9c1617bc99991d3730cfbf5878a0e9dc377e0d3d5ca2e41488a2309319bc
  PGVECTOR_PACKAGE_URL: https://apt-archive.postgresql.org/pub/repos/apt/pool/main/p/pgvector/postgresql-16-pgvector_0.8.6-1.pgdg13+1_amd64.deb?versionId=x3lsgKtr53BtiGMRJqIlPZr52kLw0jvS

jobs:
  previous-api-pr-base-evidence:
    name: Non-production PR rollback-base API evidence
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hermes_assurance
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d hermes_assurance"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install frozen current dependencies
        run: |
          bun pm cache rm || true
          bun install --frozen-lockfile

      - name: Install verified pgvector in exact PostgreSQL service
        env:
          POSTGRES_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$POSTGRES_SERVICE_CONTAINER"
          image_ref="$(docker inspect --format '{{.Config.Image}}' "$POSTGRES_SERVICE_CONTAINER")"
          test "$image_ref" = "$POSTGRES_ASSURANCE_REFERENCE"
          test "${image_ref##*@}" = "${POSTGRES_ASSURANCE_REFERENCE##*@}"
          package_name="postgresql-16-pgvector_${PGVECTOR_PACKAGE_VERSION}_amd64.deb"
          package_path="$RUNNER_TEMP/$package_name"
          rm -f "$package_path"
          trap 'rm -f "$package_path"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$package_path" "$PGVECTOR_PACKAGE_URL"
          printf '%s  %s\n' "$PGVECTOR_PACKAGE_SHA256" "$package_path" \
            | sha256sum --check --strict
          docker exec --user root "$POSTGRES_SERVICE_CONTAINER" bash -ceu '
            test "$(dpkg --print-architecture)" = amd64
            dpkg --audit
            test "$(dpkg-query --show --showformat=\${db:Status-Status} postgresql-16)" = installed
            test "$(dpkg-query --show --showformat=\${db:Status-Status} libc6)" = installed
            ! dpkg-query --show postgresql-16-jit-llvm >/dev/null 2>&1
          '
          docker cp "$package_path" "$POSTGRES_SERVICE_CONTAINER:/tmp/$package_name"
          docker exec --user root "$POSTGRES_SERVICE_CONTAINER" bash -ceu '
            package_file="$1"
            expected_version="$2"
            test "$(dpkg-deb --field "$package_file" Package)" = postgresql-16-pgvector
            test "$(dpkg-deb --field "$package_file" Version)" = "$expected_version"
            test "$(dpkg-deb --field "$package_file" Architecture)" = amd64
            dpkg --install "$package_file"
            test "$(dpkg-query --show --showformat=\${Version} postgresql-16-pgvector)" = "$expected_version"
            dpkg --audit
            rm -f "$package_file"
          ' -- "/tmp/$package_name" "$PGVECTOR_PACKAGE_VERSION"
          rm -f "$package_path"
          trap - EXIT
          docker exec "$POSTGRES_SERVICE_CONTAINER" \
            psql --username postgres --dbname hermes_assurance \
              --no-psqlrc --command "CREATE EXTENSION IF NOT EXISTS vector" >/dev/null
          docker exec "$POSTGRES_SERVICE_CONTAINER" \
            psql --username postgres --dbname hermes_assurance \
              --no-psqlrc --tuples-only --no-align \
              --command "SELECT extversion FROM pg_extension WHERE extname = 'vector'" \
            | grep -qx "$PGVECTOR_EXTENSION_VERSION"

      - name: Migrate disposable compatibility database
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hermes_assurance
          TEST_DATABASE_SAFE: "1"
        run: bun run --cwd services/api db:migrate:test

      - name: Derive and export approved rollback base
        id: rollback_base
        env:
          EXPECTED_ROLLBACK_BASE_SHA: 751f5a7ed143150488543db9a1b4ee1f1b833bfc
        run: |
          set -euo pipefail
          remote_url="$(git remote get-url origin)"
          [[ "$remote_url" =~ ^https://github\.com/[^/]+/[^/]+(\.git)?$ ]]
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/feat/hermes-secure-standalone-connect:refs/remotes/origin/feat/hermes-secure-standalone-connect
          derived_base_sha="$(git merge-base origin/main origin/feat/hermes-secure-standalone-connect)"
          test "$derived_base_sha" = "$EXPECTED_ROLLBACK_BASE_SHA"
          test "$(git cat-file -t "$derived_base_sha")" = commit
          git merge-base --is-ancestor "$derived_base_sha" "$GITHUB_SHA"
          base_dir="$RUNNER_TEMP/hermes-rollback-base"
          rm -rf "$base_dir"
          mkdir -p "$base_dir"
          git archive "$derived_base_sha" | tar -x -C "$base_dir"
          printf 'base_sha=%s\nbase_dir=%s\n' "$derived_base_sha" "$base_dir" >>"$GITHUB_OUTPUT"

      - name: Build real rollback-base API production image
        id: rollback_image
        env:
          BASE_SHA: ${{ steps.rollback_base.outputs.base_sha }}
          BASE_DIR: ${{ steps.rollback_base.outputs.base_dir }}
        run: |
          set -euo pipefail
          image_tag="index-api-rollback-base:${BASE_SHA}"
          docker build \
            --file services/api/src/cli/tests/fixtures/previous-api-base.Dockerfile \
            --tag "$image_tag" \
            "$BASE_DIR"
          image_id="$(docker inspect --format='{{.Id}}' "$image_tag")"
          test -n "$image_id"
          printf 'image_id=%s\n' "$image_id" >>"$GITHUB_OUTPUT"
          printf '### Non-production rollback-base compatibility evidence\n- Base SHA: `%s`\n- Local image ID: `%s`\n' \
            "$BASE_SHA" "$image_id" >>"$GITHUB_STEP_SUMMARY"

      - name: Record non-production rollback-base denial
        env:
          NODE_ENV: test
          ALLOW_MUTABLE_PREVIOUS_IMAGE: "1"
          PREVIOUS_API_IMAGE: ${{ steps.rollback_image.outputs.image_id }}
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hermes_assurance
          TEST_DATABASE_SAFE: "1"
          HERMES_PREVIOUS_API_REPORT: previous-api-compatibility-base-${{ steps.rollback_base.outputs.base_sha }}.json
          HERMES_PREVIOUS_API_DIAGNOSTIC: previous-api-compatibility-diagnostic.json
        run: bun run --cwd services/api verify:hermes-previous-api-compatibility

      - name: Upload previous API compatibility diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: previous-api-compatibility-diagnostic
          path: services/api/previous-api-compatibility-diagnostic.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload non-production rollback-base compatibility evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: non-production-previous-api-base-${{ steps.rollback_base.outputs.base_sha }}
          path: services/api/previous-api-compatibility-base-${{ steps.rollback_base.outputs.base_sha }}.json
          if-no-files-found: error
          retention-days: 14

  disposable-postgres-assurance:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hermes_assurance
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d hermes_assurance"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install frozen dependencies
        run: |
          bun pm cache rm || true
          bun install --frozen-lockfile

      - name: Build API and protocol
        run: bun run --cwd services/api build

      - name: Typecheck API and CLI specifications
        run: |
          bun run --cwd services/api typecheck
          bun run --cwd services/api typecheck:cli-specs

      - name: Lint API
        run: bun run --cwd services/api lint

      - name: Verify static isolated inventory and release contracts
        run: |
          bun test services/api/src/lib/testing/tests/isolated-test-suite.spec.ts \
            services/api/src/cli/tests/hermes-production-assurance-release.spec.ts \
            services/api/src/lib/testing/tests/hermes-assurance-thresholds.spec.ts

      - name: Verify provider-free privacy boundaries
        run: |
          bun test services/api/src/lib/agent/tests/hermes-runtime-telemetry.spec.ts \
            services/api/src/lib/testing/tests/hermes-assurance-output.spec.ts
          # Separate Bun invocation guarantees a fresh module graph for the mocked production Sentry sink.
          API_TEST_ISOLATED_TARGET=src/lib/agent/tests/hermes-runtime-telemetry-sentry.isolated.ts \
            bun test services/api/src/lib/testing/isolated-test-import-harness.spec.ts

      - name: Run stale and expired Index coverage smoke
        run: >-
          bun test services/api/src/services/tests/connected-agents.service.spec.ts
          --test-name-pattern "smoke reports stale and expired Hermes as indexCovering true"

      - name: Select explicit preflight thresholds
        id: preflight_thresholds
        env:
          EVENT_NAME: ${{ github.event_name }}
          APPROVED_MAX_LOCK_MS: ${{ inputs.HERMES_PREFLIGHT_MAX_LOCK_MS }}
          APPROVED_MAX_TOTAL_MS: ${{ inputs.HERMES_PREFLIGHT_MAX_TOTAL_MS }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            max_lock_ms="$APPROVED_MAX_LOCK_MS"
            max_total_ms="$APPROVED_MAX_TOTAL_MS"
            threshold_source="release-approved workflow_dispatch inputs"
          else
            max_lock_ms="5000"
            max_total_ms="30000"
            threshold_source="non-production PR fixture thresholds"
          fi
          [[ "$max_lock_ms" =~ ^[1-9][0-9]*$ ]]
          [[ "$max_total_ms" =~ ^[1-9][0-9]*$ ]]
          printf 'max_lock_ms=%s\nmax_total_ms=%s\n' "$max_lock_ms" "$max_total_ms" >>"$GITHUB_OUTPUT"
          printf 'Preflight threshold source: %s.\n' "$threshold_source" >>"$GITHUB_STEP_SUMMARY"

      - name: Install verified pgvector in PostgreSQL service
        env:
          POSTGRES_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$POSTGRES_SERVICE_CONTAINER"
          image_ref="$(docker inspect --format '{{.Config.Image}}' "$POSTGRES_SERVICE_CONTAINER")"
          test "$image_ref" = "$POSTGRES_ASSURANCE_REFERENCE"
          test "${image_ref##*@}" = "${POSTGRES_ASSURANCE_REFERENCE##*@}"
          package_name="postgresql-16-pgvector_${PGVECTOR_PACKAGE_VERSION}_amd64.deb"
          package_path="$RUNNER_TEMP/$package_name"
          rm -f "$package_path"
          trap 'rm -f "$package_path"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$package_path" "$PGVECTOR_PACKAGE_URL"
          printf '%s  %s\n' "$PGVECTOR_PACKAGE_SHA256" "$package_path" \
            | sha256sum --check --strict
          docker exec --user root "$POSTGRES_SERVICE_CONTAINER" bash -ceu '
            test "$(dpkg --print-architecture)" = amd64
            dpkg --audit
            test "$(dpkg-query --show --showformat=\${db:Status-Status} postgresql-16)" = installed
            test "$(dpkg-query --show --showformat=\${db:Status-Status} libc6)" = installed
            ! dpkg-query --show postgresql-16-jit-llvm >/dev/null 2>&1
          '
          docker cp "$package_path" "$POSTGRES_SERVICE_CONTAINER:/tmp/$package_name"
          docker exec --user root "$POSTGRES_SERVICE_CONTAINER" bash -ceu '
            package_file="$1"
            expected_version="$2"
            test "$(dpkg-deb --field "$package_file" Package)" = postgresql-16-pgvector
            test "$(dpkg-deb --field "$package_file" Version)" = "$expected_version"
            test "$(dpkg-deb --field "$package_file" Architecture)" = amd64
            dpkg --install "$package_file"
            test "$(dpkg-query --show --showformat=\${Version} postgresql-16-pgvector)" = "$expected_version"
            dpkg --audit
            rm -f "$package_file"
          ' -- "/tmp/$package_name" "$PGVECTOR_PACKAGE_VERSION"
          rm -f "$package_path"
          trap - EXIT
          docker exec "$POSTGRES_SERVICE_CONTAINER" \
            psql --username postgres --dbname hermes_assurance \
              --no-psqlrc --command "CREATE EXTENSION IF NOT EXISTS vector" >/dev/null
          docker exec "$POSTGRES_SERVICE_CONTAINER" \
            psql --username postgres --dbname hermes_assurance \
              --no-psqlrc --tuples-only --no-align \
              --command "SELECT extversion FROM pg_extension WHERE extname = 'vector'" \
            | grep -qx "$PGVECTOR_EXTENSION_VERSION"

      - name: Run Hermes production assurance
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hermes_assurance
          TEST_DATABASE_SAFE: "1"
          API_TEST_REQUIRE_DATABASE: "1"
          HERMES_PREFLIGHT_MAX_LOCK_MS: ${{ steps.preflight_thresholds.outputs.max_lock_ms }}
          HERMES_PREFLIGHT_MAX_TOTAL_MS: ${{ steps.preflight_thresholds.outputs.max_total_ms }}
          HERMES_PREFLIGHT_REPORT: hermes-migration-preflight-report.json
        run: |
          bun run --cwd services/api db:migrate:test
          bun run --cwd services/api test:hermes-production-assurance

      - name: Run emergency control dry-run only
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hermes_assurance
          TEST_DATABASE_SAFE: "1"
        run: |
          set -euo pipefail
          plan_file="$(mktemp)"
          trap 'rm -f "$plan_file"' EXIT
          bun run --cwd services/api maintenance:hermes-emergency-control -- --audience hermes-agent >"$plan_file"
          bun -e '
            const value = await Bun.file(process.argv[1]).json();
            const expectedKeys = ["planId", "audience", "installations", "credentials", "permissions", "owners", "reason", "durationMs"];
            if (Object.keys(value).sort().join(",") !== expectedKeys.sort().join(",")) process.exit(1);
            if (value.audience !== "hermes-agent" || value.reason !== "dry-run") process.exit(1);
            if (typeof value.planId !== "string" || !/^hecp_[A-Za-z0-9_-]{43}$/.test(value.planId)) process.exit(1);
            if (!Number.isFinite(value.durationMs) || value.durationMs < 0) process.exit(1);
            for (const field of ["installations", "credentials", "permissions", "owners"]) {
              if (!Number.isSafeInteger(value[field]) || value[field] < 0) process.exit(1);
            }
          ' "$plan_file"
          rm -f "$plan_file"
          trap - EXIT

      - name: Create aggregate credential-free assurance evidence
        env:
          MAX_LOCK_MS: ${{ steps.preflight_thresholds.outputs.max_lock_ms }}
          MAX_TOTAL_MS: ${{ steps.preflight_thresholds.outputs.max_total_ms }}
        run: |
          bun -e '
            const preflight = await Bun.file("services/api/hermes-migration-preflight-report.json").json();
            const allowed = ["checkedAt", "duplicateSelections", "expiryMismatches", "invalidDedicatedCredentials", "invalidLegacyMetadata", "lockDurationMs", "missingIndexes"];
            if (Object.keys(preflight).sort().join(",") !== allowed.sort().join(",")) process.exit(1);
            const evidence = {
              schemaVersion: 1,
              result: "passed",
              gates: [
                "migrations", "authority", "lifecycle", "preflight-100k", "telemetry-aggregate",
                "emergency-concurrency-rollback", "emergency-dry-run", "stale-index-coverage",
                "expired-index-coverage", "build", "typecheck", "cli-typecheck", "lint", "static-inventory",
                "telemetry-privacy", "assurance-output-sanitization", "sentry-sink",
              ],
              preflightThresholdsMs: {
                maxLock: Number(process.env.MAX_LOCK_MS),
                maxTotal: Number(process.env.MAX_TOTAL_MS),
              },
              reports: ["hermes-migration-preflight-report.json"],
            };
            await Bun.write("services/api/hermes-backend-assurance.json", JSON.stringify(evidence, null, 2) + "\n");
          '

      - name: Upload aggregate assurance and sanitized reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hermes-backend-production-assurance
          path: |
            services/api/hermes-backend-assurance.json
            services/api/hermes-migration-preflight-report.json
          if-no-files-found: error
          retention-days: 30

  previous-api-protected-compatibility:
    name: Protected currently-deployed API compatibility gate
    if: github.event_name == 'workflow_dispatch'
    environment: production
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hermes_assurance
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d hermes_assurance"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install frozen dependencies
        run: |
          bun pm cache rm || true
          bun install --frozen-lockfile

      - name: Install verified pgvector in exact PostgreSQL service
        env:
          POSTGRES_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$POSTGRES_SERVICE_CONTAINER"
          image_ref="$(docker inspect --format '{{.Config.Image}}' "$POSTGRES_SERVICE_CONTAINER")"
          test "$image_ref" = "$POSTGRES_ASSURANCE_REFERENCE"
          test "${image_ref##*@}" = "${POSTGRES_ASSURANCE_REFERENCE##*@}"
          package_name="postgresql-16-pgvector_${PGVECTOR_PACKAGE_VERSION}_amd64.deb"
          package_path="$RUNNER_TEMP/$package_name"
          rm -f "$package_path"
          trap 'rm -f "$package_path"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$package_path" "$PGVECTOR_PACKAGE_URL"
          printf '%s  %s\n' "$PGVECTOR_PACKAGE_SHA256" "$package_path" \
            | sha256sum --check --strict
          docker exec --user root "$POSTGRES_SERVICE_CONTAINER" bash -ceu '
            test "$(dpkg --print-architecture)" = amd64
            dpkg --audit
            test "$(dpkg-query --show --showformat=\${db:Status-Status} postgresql-16)" = installed
            test "$(dpkg-query --show --showformat=\${db:Status-Status} libc6)" = installed
            ! dpkg-query --show postgresql-16-jit-llvm >/dev/null 2>&1
          '
          docker cp "$package_path" "$POSTGRES_SERVICE_CONTAINER:/tmp/$package_name"
          docker exec --user root "$POSTGRES_SERVICE_CONTAINER" bash -ceu '
            package_file="$1"
            expected_version="$2"
            test "$(dpkg-deb --field "$package_file" Package)" = postgresql-16-pgvector
            test "$(dpkg-deb --field "$package_file" Version)" = "$expected_version"
            test "$(dpkg-deb --field "$package_file" Architecture)" = amd64
            dpkg --install "$package_file"
            test "$(dpkg-query --show --showformat=\${Version} postgresql-16-pgvector)" = "$expected_version"
            dpkg --audit
            rm -f "$package_file"
          ' -- "/tmp/$package_name" "$PGVECTOR_PACKAGE_VERSION"
          rm -f "$package_path"
          trap - EXIT
          docker exec "$POSTGRES_SERVICE_CONTAINER" \
            psql --username postgres --dbname hermes_assurance \
              --no-psqlrc --command "CREATE EXTENSION IF NOT EXISTS vector" >/dev/null
          docker exec "$POSTGRES_SERVICE_CONTAINER" \
            psql --username postgres --dbname hermes_assurance \
              --no-psqlrc --tuples-only --no-align \
              --command "SELECT extversion FROM pg_extension WHERE extname = 'vector'" \
            | grep -qx "$PGVECTOR_EXTENSION_VERSION"

      - name: Migrate disposable compatibility database
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hermes_assurance
          TEST_DATABASE_SAFE: "1"
        run: bun run --cwd services/api db:migrate:test

      - name: Verify the release-ops supplied currently deployed image
        env:
          PREVIOUS_API_IMAGE: ${{ inputs.PREVIOUS_API_IMAGE }}
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hermes_assurance
          TEST_DATABASE_SAFE: "1"
          HERMES_PREVIOUS_API_REPORT: previous-api-compatibility-protected.json
          HERMES_PREVIOUS_API_DIAGNOSTIC: previous-api-compatibility-diagnostic.json
        run: bun run --cwd services/api verify:hermes-previous-api-compatibility

      - name: Upload previous API compatibility diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: previous-api-compatibility-diagnostic
          path: services/api/previous-api-compatibility-diagnostic.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload protected compatibility evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protected-previous-api-compatibility-evidence
          path: services/api/previous-api-compatibility-protected.json
          if-no-files-found: error
          retention-days: 30
