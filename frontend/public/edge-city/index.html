<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edge Claw — Your Agent for Edge Esmeralda 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f4ede0;
    --cream-warm: #ede2cf;
    --cream-soft: #faf5ea;
    --forest: #1f2d1c;
    --forest-deep: #0f1a12;
    --forest-mid: #2d3f29;
    --sage: #dde5cc;
    --sage-mid: #c5d1ae;
    --sage-deep: #7a9168;     /* harmonized accent — replaces #5a8c4f */
    --sage-light: #a8c0a1;    /* harmonized accent — replaces #9ec78f / #a8c39f */
    --ink: #29311e;
    --ink-soft: #29311e;
    --ink-faded: rgba(26, 24, 20, 0.55);
    --sky: #c8dde6;
    --sky-soft: #e8eef0;
    --sky-mid: #92b1bd;        /* harmonized accent — replaces #7fa3b4 */
    --rose: #d4a89c;
    --gold: #c9a961;
    --rule: rgba(26, 24, 20, 0.18);
    --rule-soft: rgba(26, 24, 20, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--cream); color: var(--ink); font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  body { overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }

  /* PP Neue Machina — Inktrap, Ultrabold (the heaviest weight in the family). */
  @font-face {
    font-family: 'PPNeueMachina';
    src: url('/edge-city/fonts/PPNeueMachina-InktrapUltrabold.otf') format('opentype');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  .display { font-family: 'Cormorant Garamond', 'Georgia', serif; font-weight: 600; letter-spacing: -0.01em; }
  .italic-display { font-family: 'Instrument Serif', 'Cormorant Garamond', serif; font-style: italic; font-weight: 400; }

  /* Single source of truth for every section title — same font, weight, size everywhere. */
  .section-title {
    font-family: 'PPNeueMachina', 'Inter', system-ui, sans-serif;
    font-weight: 700;
    font-style: normal;
    font-size: clamp(36px, 4.4vw, 56px);
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: #29311e;
    margin: 0;
  }
  .section-title em,
  .section-title i,
  .section-title span {
    font-family: inherit;
    font-style: normal;
    font-weight: inherit;
    color: inherit;
  }
  .eyebrow { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; }
  .body { font-family: 'Inter', sans-serif; font-size: 18px; line-height: 1.55; color: var(--ink-soft); }

  /* ===== Healdsburg cinematic map ===== */
  .hb-scroll-section {
    position: relative;
    width: 100%;
    height: 100vh;             /* one viewport — cinematic is event-driven, not scroll-driven */
    background: #3a2e2a;
  }
  .hb-sticky {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }
  .hb-viewer { width: 100%; height: 100%; }

  .map-sprite {
    position: relative;
    width: 100%;
    height: 100%;
    background: transparent !important;
    border: none;
    padding: 0;
    margin: 0;
    box-shadow: none;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    pointer-events: none;
  }
  .map-sprite-spotlight {
    position: absolute;
    bottom: 0;
    left: -40%;
    width: 180%;
    height: 60%;
    background: radial-gradient(ellipse at center, rgba(255, 235, 195, 0.55) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
  .map-sprite-img {
    position: relative;
    z-index: 1;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(2px 4px 4px rgba(0, 0, 0, 0.3));
    pointer-events: auto;
    cursor: pointer;
    user-select: none;
    -webkit-user-drag: none;
    transition: transform 180ms ease, filter 180ms ease;
  }
  .map-sprite-img:hover {
    transform: scale(1.06);
    filter: drop-shadow(2px 6px 8px rgba(0, 0, 0, 0.4));
  }
  .story-bubble {
    background: #f5ede0;
    border: 1px solid #c4a574;
    border-radius: 10px;
    padding: 12px 16px;
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    font-size: 16px;
    line-height: 1.45;
    color: #4a3a2a;
    max-width: 280px;
    white-space: normal;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.28);
    opacity: 0;
    visibility: hidden;
    transition: opacity 200ms;
    pointer-events: none;
    user-select: none;
  }
  .story-bubble.show { opacity: 1; visibility: visible; }

  /* ===== ?edit reposition panel + toggle ===== */
  .hb-edit-toggle {
    position: absolute;
    bottom: 24px;
    right: 24px;
    z-index: 60;
    padding: 8px 14px;
    background: rgba(20, 16, 14, 0.85);
    color: #f4ede0;
    border: 1px solid rgba(255, 253, 247, 0.25);
    border-radius: 999px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-decoration: none;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    cursor: pointer;
  }
  .hb-edit-toggle:hover { background: rgba(20, 16, 14, 1); }

  .hb-edit-panel {
    position: absolute;
    top: 16px;
    right: 16px;
    z-index: 20;
    width: 320px;
    max-height: calc(100vh - 32px);
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    background: rgba(20, 16, 14, 0.92);
    border: 1px solid rgba(255, 253, 247, 0.18);
    border-radius: 10px;
    color: #f4ede0;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
  }
  .hb-edit-panel-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
  }
  .hb-edit-panel-head span { opacity: 0.6; font-size: 11px; }
  .hb-edit-panel textarea {
    flex: 1;
    min-height: 280px;
    background: rgba(0, 0, 0, 0.4);
    color: #f4ede0;
    border: 1px solid rgba(255, 253, 247, 0.12);
    border-radius: 6px;
    padding: 8px;
    font: inherit;
    resize: vertical;
  }
  .hb-edit-panel-actions {
    display: flex;
    gap: 8px;
  }
  .hb-edit-panel button {
    flex: 1;
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .hb-edit-secondary {
    background: rgba(255, 253, 247, 0.12);
    color: #f4ede0;
    border: 1px solid rgba(255, 253, 247, 0.18) !important;
  }
  .hb-edit-secondary:hover { background: rgba(255, 253, 247, 0.18); }
  .hb-edit-primary { background: #f4ede0; color: #0f1a12; }
  .hb-edit-primary:hover { background: #fff; }
  .hb-edit-status {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    min-height: 14px;
    color: rgba(244, 237, 224, 0.7);
  }
  .hb-edit-panel.locked .hb-edit-status { color: #a8c0a1; }
  .hb-edit-panel.locked textarea { opacity: 0.6; }
</style>
<script src="https://cdn.jsdelivr.net/npm/openseadragon@4.1.1/build/openseadragon/openseadragon.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
