# Railway config-as-code template for the MoralMod assessment service.
# Copy the relevant [service] block into each Railway service's settings
# (Railway reads one railway.toml per service). Values in <angle brackets>
# come from the lab or the Railway project.

# ---- assessment-api ----------------------------------------------------
[build]
# Lab-pushed image; ask the lab for the validated pin.
image = "ghcr.io/sydney-levine-lab/decision-studio@<PIN>"

[deploy]
startCommand = "python -m decision_service.main api"
healthcheckPath = "/healthz"
healthcheckTimeout = 60
numReplicas = 2
restartPolicyType = "ON_FAILURE"

# ---- assessment-worker -------------------------------------------------
# [build] same image as assessment-api.
# [deploy]
# startCommand = "python -m decision_service.main worker --concurrency 8"
# numReplicas = 6            # 6 x 8 = 48 concurrent assessments; tune from metrics
# restartPolicyType = "ON_FAILURE"

