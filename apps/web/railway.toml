# Railway web app service configuration.
[build]
watchPatterns = [
  "/apps/web/**",
  "/docs/protocol-atlas/**",
  "/scripts/build-protocol-atlas.ts",
  "/scripts/tests/build-protocol-atlas.spec.ts",
  "/packages/protocol/**",
  "/bun.lock",
  "/package.json",
]
buildCommand = "bun run build:web"

[deploy]
startCommand = "cd apps/web && bun run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
