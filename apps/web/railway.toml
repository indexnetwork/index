# Railway web app service configuration.
[build]
watchPatterns = [
  "/apps/web/**",
  "/packages/protocol/**",
  "/bun.lock",
  "/package.json",
]
buildCommand = "bun run build:package:protocol && bun run build:web"

[deploy]
startCommand = "cd apps/web && bun run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
