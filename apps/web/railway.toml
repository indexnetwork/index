# Railway web app service configuration.
[build]
watchPatterns = [
  "/apps/web/**",
  "/packages/protocol/**",
  "/packages/a2a/**",
  "/packages/agent/**",
  "/bun.lock",
  "/package.json",
]
buildCommand = "bun run build:package:a2a && bun run build:package:agent && bun run build:package:protocol && bun run build:web"

[deploy]
startCommand = "cd apps/web && bun run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
