<style>
  :root {
    --bg: #0a0a0c;
    --bg-1: #0d0d10;
    --bg-2: #111115;
    --bg-3: #16161b;
    --line: rgba(255,255,255,0.055);
    --line-2: rgba(255,255,255,0.10);
    --text: #ebe7df;
    --text-2: #b6b1a6;
    --dim: #6e6a62;
    --dim-2: #46433d;
    --orange: #ff7a1a;
    --orange-2: #ffa15a;
    --orange-dim: #7a3a10;
    --glow: 0 0 24px rgba(255,122,26,.35), 0 0 1px rgba(255,122,26,.8);
    --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
    --mono: "Geist Mono", ui-monospace, "JetBrains Mono", "Menlo", monospace;
  }
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }
  /* faint vignette + grain */
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(255,122,26,0.06), transparent 55%),
      radial-gradient(80% 60% at 100% 100%, rgba(255,122,26,0.025), transparent 60%);
    z-index: 1;
  }
  #root { position: relative; z-index: 3; }
  ::selection { background: rgba(255,122,26,0.35); color: #fff; }

  /* tiny scrollbar */
  .scroll::-webkit-scrollbar { width: 6px; height: 6px; }
  .scroll::-webkit-scrollbar-track { background: transparent; }
  .scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 6px; }
  .scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.12); }

  /* keyframes */
  @keyframes pulse-dot {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,122,26,0.6); }
    50% { box-shadow: 0 0 0 8px rgba(255,122,26,0); }
  }
  @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fade-in { from { opacity: 0 } to { opacity: 1 } }
  @keyframes shimmer {
    0% { background-position: -200px 0 }
    100% { background-position: 200px 0 }
  }
  @keyframes orbit {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @keyframes drift-x {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(2px); }
  }

  .pulse-dot {
    width: 8px; height: 8px; border-radius: 999px;
    background: var(--orange);
    animation: pulse-dot 2.2s ease-out infinite;
  }
  .caret::after {
    content: "▍";
    color: var(--orange);
    margin-left: 2px;
