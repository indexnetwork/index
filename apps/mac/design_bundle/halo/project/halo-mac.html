<!doctype html>
<html lang="en">

<meta charset="utf-8">

<title>halo — System 6</title>

<style>
  :root{
    --mac-sans: "ChicagoFLF","Charcoal","Geneva","Lucida Grande",-apple-system,system-ui,Tahoma,Verdana,sans-serif;
    --mac-mono: "JetBrains Mono","Monaco","Menlo",ui-monospace,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body,#root{height:100%}
  body{
    background:#fff;
    color:#000;
    font-family: var(--mac-sans);
    font-size:13px;
    line-height:1.4;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  /* ---------- Mac menubar ---------- */
  .mac-menubar{
    position:fixed; top:0; left:0; right:0; height:20px;
    background:#fff;
    border-bottom:1px solid #000;
    display:flex; align-items:center;
    padding:0 10px; gap:0;
    z-index:1000;
    font-size:13px;
  }
  .mac-menubar .m{
    padding:1px 9px; cursor:default;
    line-height:1; height:18px;
    display:flex; align-items:center;
  }
  .mac-menubar .m.bold{ font-weight:700 }
  .mac-menubar .m.apple{
    width:18px; padding:0;
    justify-content:center;
  }
  .mac-menubar .m.apple::before{
    content:""; display:block;
    width:11px; height:13px;
    background:#000;
    -webkit-mask:
      radial-gradient(circle 4px at 7px 2px, transparent 99%, #000 100%)
      , linear-gradient(#000, #000);
    mask: linear-gradient(#000, #000);
    /* simple apple-ish silhouette — black blob with a notch */
    clip-path: polygon(
      30% 0, 60% 0, 65% 10%, 100% 25%, 100% 70%, 80% 100%, 50% 95%, 20% 100%, 0 70%, 0 30%, 25% 15%
    );
  }
  .mac-menubar .m:hover{ background:#000; color:#fff }
  .mac-menubar .m.subtle{ color:#444 }
  .mac-menubar .m.subtle:hover{ background:transparent; color:#444 }
  .mac-menubar .right{ margin-left:auto; display:flex; align-items:center }
  .mac-menubar .clock{ padding:1px 10px; font-size:12px }

  /* ---------- Mac desktop ---------- */
  .mac-desktop{
    background-color:#fff;
    background-image:
      linear-gradient(45deg, #000 25%, transparent 25%),
      linear-gradient(-45deg, #000 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #000 75%),
      linear-gradient(-45deg, transparent 75%, #000 75%);
    background-size: 2px 2px;
    background-position: 0 0, 0 1px, 1px -1px, -1px 0;
  }

  /* ---------- Window chrome (MacWindow JSX uses these) ---------- */
  .mac-titlebar{
    height:18px; flex:0 0 auto;
    border-bottom:1px solid #000;
    background:repeating-linear-gradient(0deg, #fff 0, #fff 1px, #000 1px, #000 2px);
    display:flex; align-items:center;
    padding:0 6px;
    cursor:default;
    user-select:none;
  }
  .mac-titlebar .mac-close{
    width:11px; height:11px;
    border:1px solid #000;
    background:#fff;
    flex:0 0 auto;
    cursor:pointer;
  }
  .mac-titlebar .mac-close:active{background:#000}
  .mac-titlebar .mac-title{
    background:#fff; padding:0 10px;
    margin:0 auto;
    font-size:12px; white-space:nowrap; line-height:1;
    font-family:var(--mac-sans);
  }
  .mac-titlebar .mac-zoom{
    width:11px; height:11px;
    border:1px solid #000; background:#fff;
    position:relative; flex:0 0 auto;
  }
  .mac-titlebar .mac-zoom::after{
    content:""; position:absolute; inset:1px;
    border:1px solid #000;
  }

  /* ---------- Scrollbars (b&w mac style) ---------- */
  .mac-scroll::-webkit-scrollbar{ width:13px; height:13px; background:#fff }
  .mac-scroll::-webkit-scrollbar-track{
    background-color:#fff;
    background-image:
      linear-gradient(45deg, #000 25%, transparent 25%),
      linear-gradient(-45deg, #000 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #000 75%),
      linear-gradient(-45deg, transparent 75%, #000 75%);
    background-size: 2px 2px;
    background-position: 0 0, 0 1px, 1px -1px, -1px 0;
    border-left:1px solid #000;
  }
  .mac-scroll::-webkit-scrollbar-thumb{
    background:#fff; border:1px solid #000;
  }
  .mac-scroll::-webkit-scrollbar-corner{ background:#fff }

  /* ---------- Animations ---------- */
  @keyframes mac-blink { 50%{ opacity:0.15 } }
  @keyframes mac-orbit { from{ transform:rotate(0deg) } to{ transform:rotate(360deg) } }
  @keyframes mac-stripes {
    from { background-position: 0 0 }
    to   { background-position: 24px 0 }
  }
  @keyframes fade-up {
    from { opacity:0; transform:translateY(4px) }
    to   { opacity:1; transform:translateY(0) }
  }
  @keyframes fade-in { from { opacity:0 } to { opacity:1 } }
  .fade-up{ animation: fade-up 260ms cubic-bezier(.2,.7,.2,1) both }
  .fade-in{ animation: fade-in 500ms ease both }

  /* mac-caret: classic block cursor */
  .mac-caret::after{
    content:"▍"; margin-left:2px;
    animation: mac-blink 1s steps(2) infinite;
  }

  ::selection{ background:#000; color:#fff }

  /* placeholder color */
  input::placeholder{ color:#888 }

  /* reset some defaults */
  a,button{ color:inherit; font: inherit; background:none; border:none; padding:0 }
  button{ cursor:pointer }
</style>
