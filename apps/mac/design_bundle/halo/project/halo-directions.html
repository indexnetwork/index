<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>halo · ui directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{
    font-family:'Inter', -apple-system, system-ui, sans-serif;
    background:#1a1a1c;
  }
  .frame-iframe{
    width:100%; height:100%; border:0; display:block;
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;

  function Frame({ src }) {
    return <iframe className="frame-iframe" src={src} title={src} />;
  }

  function App() {
    return (
      <DesignCanvas title="halo · four directions" subtitle="proactive feed + live pipeline, rendered four ways">
        <DCSection id="pipeline" title="Pipeline screen — four directions">
          <DCArtboard id="pa" label="A — Organized CLI · refined terminal" width={1440} height={900}>
            <Frame src="halo-p-a-cli.html" />
          </DCArtboard>

          <DCArtboard id="pb" label="B — Hybrid · TUI meets GUI · sidebar + cards" width={1440} height={900}>
            <Frame src="halo-p-b-hybrid.html" />
          </DCArtboard>

          <DCArtboard id="pc" label="C — Macintosh · System 6 chrome, B&W" width={1440} height={900}>
            <Frame src="halo-p-c-mac.html" />
          </DCArtboard>

          <DCArtboard id="pd" label="D — Editorial · cream paper, serif, restrained" width={1440} height={900}>
            <Frame src="halo-p-d-editorial.html" />
          </DCArtboard>
        </DCSection>

        <DCSection id="earlier" title="Earlier — single-screen directions">
          <DCArtboard id="v2" label="A0 — Organized CLI (old content)" width={1280} height={800}>
            <Frame src="halo-v2-clean-cli.html" />
          </DCArtboard>
          <DCArtboard id="v3" label="B0 — Hybrid (old content)" width={1280} height={800}>
            <Frame src="halo-v3-hybrid.html" />
          </DCArtboard>
          <DCArtboard id="v4" label="C0 — Macintosh (old content)" width={1280} height={800}>
            <Frame src="halo-v4-mac.html" />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
