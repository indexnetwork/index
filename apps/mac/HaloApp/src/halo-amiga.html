<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>index — Workbench 1.3</title>

<style>
  /* Both faces are bundled, not fetched: assemble.py rewrites these url()s
     into base64 data: URIs, so the app renders identically with the network
     off — same reason React and Babel are inlined. Editing src/halo-amiga.html
     directly in a browser still works, since the relative paths resolve.

     Both are variable fonts carrying 400–700 in a single file, so one @font-face
     each covers every weight the five roles need. Licence: SIL OFL 1.1 (both),
     which permits redistribution inside the bundle. */
  @font-face{
    font-family:"JetBrains Mono";
    src: url("fonts/jetbrains-mono-latin-var.woff2") format("woff2");
    font-weight: 400 700; font-style: normal; font-display: block;
  }
  @font-face{
    font-family:"IBM Plex Sans";
    src: url("fonts/ibm-plex-sans-latin-var.woff2") format("woff2");
    font-weight: 400 700; font-style: normal; font-display: block;
  }

  :root{
    /* Amiga Workbench 1.x 4-color palette */
    --amiga-bg:     #0055AA;   /* desktop blue */
    --amiga-fg:     #000000;   /* black ink */
    --amiga-paper:  #FFFFFF;   /* window body white */
    --amiga-accent: #FF8A00;   /* title bar / highlight orange */
    --amiga-light:  #FFFFFF;   /* bevel highlight */
    --amiga-dark:   #000000;   /* bevel shadow */

    /* Text ink — four steps, not ten. The greys are warm-biased (they carry a
       little of the accent's hue) so they read as chosen against the white
       paper rather than as default browser greys. Before this existed the app
       used #444/#555/#666/#888/#999/#bbb/#ccc AND #5A5548/#6B6659/#8A8578
       interchangeably for the same two or three jobs. */
    --ink:      #000000;   /* primary — body, headings */
    --ink-2:    #5A5548;   /* secondary — helper text, supporting copy */
    --ink-3:    #8A8578;   /* tertiary — meta, timestamps, hints */
    --ink-4:    #B5AF9F;   /* faint — separators, placeholder-weight tags */
    --ink-warn: #8A0000;   /* destructive — leave/remove/disconnect */

    /* Two families, six roles — the roles differ by weight, not by family:
         window titles  JetBrains Mono 500   (.mac-titlebar .mac-title)
         labels         JetBrains Mono 400   (--amiga-mono, the small-text face)
         hero headings  JetBrains Mono 500   (the big display h1 on login/landing/intents)
         headings       IBM Plex Sans 500    (--amiga-title: section h2s, person names)
         body           IBM Plex Sans 400    (--amiga-sans)
         form inputs    IBM Plex Sans 400    (input/textarea/select inherit --amiga-sans)

       Labels vs body already tracked this split before the swap: --amiga-mono
       usages cluster at 9–12.5px (chips, badges, metadata) while --amiga-sans
       sits at 13–13.5px (paragraphs), so no call sites needed rewriting. */

    /* labels + window chrome */
    --amiga-mono: "JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
    /* body + form inputs */
    --amiga-sans: "IBM Plex Sans","Helvetica Neue","Tahoma","Geneva",-apple-system,system-ui,sans-serif;
    /* headings — same family as body, separated so it can diverge later */
    --amiga-title: "IBM Plex Sans","Helvetica Neue",-apple-system,system-ui,sans-serif;

    /* keep the existing --mac-* variables aliased so the shared primitives still work */
    --mac-sans: var(--amiga-sans);
    --mac-mono: var(--amiga-mono);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  /* native-app feel: arrow cursor everywhere (no web hand pointer),
     I-beam only over editable text. hovers are unaffected. */
  *, *::before, *::after{ cursor:default !important; }
  input, textarea, [contenteditable]{ cursor:text !important; }
  html,body,#root{height:100%}
  body{
    background:var(--amiga-bg);
    color:var(--amiga-fg);
    font-family: var(--amiga-sans);
    font-size:13px;
    line-height:1.35;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  /* keep chrome elements using the same condensed font */
  body, button, input, textarea, select { font-family: var(--amiga-sans); }

  /* ---------- Amiga workbench menu bar (white, like the reference) ---------- */
  .mac-menubar{
    position:fixed; top:0; left:0; right:0; height:24px;
    background: var(--amiga-paper);
    border-bottom: 2px solid var(--amiga-fg);
    display:flex; align-items:center;
    padding:0 8px; gap:0;
    z-index:1000;
    font-size:13px;
    color: var(--amiga-fg);
    font-family: var(--amiga-sans);
    letter-spacing: 0.3px;
  }
  .mac-menubar .m{
    padding:0 10px; cursor:default;
    line-height:1; height:22px;
    display:flex; align-items:center;
    white-space: nowrap;
  }
  .mac-menubar .m.bold{ font-weight:700; color: var(--amiga-fg) }
  .mac-menubar .m.apple{
    width:auto; padding:0 8px;
    justify-content:center;
  }
  .mac-menubar .m.apple::before{
    content:"AmigaDOS";
    display:inline;
    width:auto; height:auto;
    background:none; -webkit-mask:none; mask:none; clip-path:none;
    font-family: var(--amiga-sans);
  }
  .mac-menubar .m:hover{ background: var(--amiga-fg); color: var(--amiga-accent) }
  .mac-menubar .m.subtle{ color: #555; }
  .mac-menubar .m.subtle:hover{ background:transparent; color: #555 }
  .mac-menubar .right{ margin-left:auto; display:flex; align-items:center; gap:0; white-space:nowrap; }
  .mac-menubar .clock{
    padding:0 10px; font-size:12px;
    font-family: var(--amiga-sans);
    white-space: nowrap; color:#555;
  }

  /* ---------- Workbench desktop (1.3 dotted blue) ---------- */
  .mac-desktop{
    background-color: var(--amiga-bg);
    background-image:
      radial-gradient(rgba(255,255,255,0.22) 1px, transparent 1px);
    background-size: 4px 4px;
    background-position: 0 0;
  }

  /* ---------- Workbench window chrome ---------- */
  .mac-titlebar{
    height:24px; flex:0 0 auto;
    border-bottom: 2px solid var(--amiga-fg);
    background: var(--amiga-paper);
    display:flex; align-items:stretch;
    padding: 0;
    gap: 0;
    cursor:default;
    user-select:none;
    color: var(--amiga-fg);
    font-family: var(--amiga-sans);
  }
  /* Close gadget: Workbench-style square button on LEFT.
     Outlined square with a solid centre block — the 1.3 close gadget. An
     outline on its own reads as an empty box, so the centre is what makes it
     legible as a button. */
  .mac-titlebar .mac-close{
    width:24px; height:100%;
    border-right: 2px solid var(--amiga-fg);
    background: var(--amiga-paper);
    flex:0 0 auto;
    cursor:pointer;
    position:relative;
  }
  .mac-titlebar .mac-close::before{
    content:""; position:absolute;
    left:50%; top:50%;
    width:14px; height:14px;
    transform: translate(-50%,-50%);
    border: 2px solid var(--amiga-fg);
    background: var(--amiga-paper);
  }
  .mac-titlebar .mac-close::after{
    content:""; position:absolute;
    left:50%; top:50%;
    width:6px; height:6px;
    transform: translate(-50%,-50%);
    background: var(--amiga-fg);
  }
  .mac-titlebar .mac-close:hover::before{ background: var(--amiga-accent); }
  /* pressed: whole gadget inverts to the highlight colour, gadget ink stays black */
  .mac-titlebar .mac-close:active{ background: var(--amiga-accent); }
  .mac-titlebar .mac-close:active::before{ background: var(--amiga-accent); }
  /* Title: text chip on the left, dotted drag-bar filling the rest */
  .mac-titlebar .mac-title{
    flex: 1; min-width:0;
    display:flex; align-items:center;
    padding: 0;
    margin: 0;
    font-size:13px;
    /* window title role: JetBrains Mono Medium — the mono face, not the
       heading face, so chrome and content read as different systems */
    font-weight:500;
    white-space:nowrap; line-height:1;
    font-family: var(--amiga-mono);
    letter-spacing: 0.3px;
    color: var(--amiga-fg);
    position:relative;
    overflow:hidden;
    /* horizontal drag-bar lines, Workbench-style */
    background-image: repeating-linear-gradient(
      0deg, var(--amiga-fg) 0 2px, transparent 2px 6px);
    background-position: 0 4px;
  }
  .mac-titlebar .mac-title > .t{
    background: var(--amiga-paper);
    padding: 0 12px 0 8px;
    margin-left: 4px;
    height:100%;
    display:flex; align-items:center;
    white-space:nowrap;
    flex: 0 0 auto;
  }
  /* Depth/zoom gadgets on RIGHT */
  .mac-titlebar .mac-zoom{
    width:24px; height:100%;
    border-left: 2px solid var(--amiga-fg);
    background: var(--amiga-paper);
    position:relative;
    flex:0 0 auto;
  }
  .mac-titlebar .mac-zoom::after{
    content:""; position:absolute;
    left: 5px; top: 5px;
    width: 9px; height: 9px;
    border: 2px solid var(--amiga-fg);
    background: var(--amiga-paper);
  }
  .mac-titlebar .mac-zoom::before{
    content:""; position:absolute;
    right: 4px; bottom: 4px;
    width: 11px; height: 11px;
    border: 2px solid var(--amiga-fg);
    background: var(--amiga-paper);
  }

  /* All windows get the Workbench double-bevel frame applied by primitives */
  .amiga-window{
    background: var(--amiga-paper);
    border: 2px solid var(--amiga-fg);
    box-shadow:
      inset 2px 2px 0 var(--amiga-paper),
      inset -2px -2px 0 #6E6E6E;
  }

  /* ---------- Scrollbars (Workbench style) ---------- */
  .mac-scroll::-webkit-scrollbar{ width:16px; height:16px; background: var(--amiga-paper) }
  .mac-scroll::-webkit-scrollbar-track{
    background: var(--amiga-paper);
    border-left: 2px solid var(--amiga-fg);
  }
  .mac-scroll::-webkit-scrollbar-thumb{
    background: var(--amiga-accent);
    border: 1px solid var(--amiga-fg);
    box-shadow:
      inset 1px 1px 0 #FFD7A0,
      inset -1px -1px 0 #8A4500;
  }
  .mac-scroll::-webkit-scrollbar-corner{ background: var(--amiga-paper) }

  /* ---------- Animations (kept identical) ---------- */
  @keyframes mac-blink { 50%{ opacity:0.15 } }
  @keyframes mac-orbit { from{ transform:rotate(0deg) } to{ transform:rotate(360deg) } }
  @keyframes mac-stripes {
    from { background-position: 0 0 }
    to   { background-position: 24px 0 }
  }
  @keyframes fade-up {
    from { opacity:0; transform:translateY(4px) }
    to   { opacity:1; transform:translateY(0) }
  }
  @keyframes fade-in { from { opacity:0 } to { opacity:1 } }
  .fade-up{ animation: fade-up 260ms cubic-bezier(.2,.7,.2,1) both }
  .fade-in{ animation: fade-in 500ms ease both }

  .mac-caret::after{
    content:"_"; margin-left:2px;
    animation: mac-blink 1s steps(2) infinite;
    color: var(--amiga-accent);
    font-weight: 700;
  }

  ::selection{ background: var(--amiga-accent); color: var(--amiga-fg) }
  input::placeholder{ color: #888 }

  a,button{ color:inherit; font: inherit; background:none; border:none; padding:0 }
  button{ cursor:pointer }

  /* ---------- Amiga gadget (button) global override ---------- */
  .amiga-gadget{
    border: 1px solid var(--amiga-fg) !important;
    background: var(--amiga-paper) !important;
    color: var(--amiga-fg) !important;
    box-shadow:
      inset 1px 1px 0 var(--amiga-light),
      inset -1px -1px 0 #888,
      1px 1px 0 var(--amiga-fg) !important;
    border-radius: 0 !important;
    font-family: var(--amiga-mono);
    text-transform: lowercase;
    letter-spacing: 0.5px;
  }
  .amiga-gadget:active{
    box-shadow:
      inset 1px 1px 0 #888,
      inset -1px -1px 0 var(--amiga-light),
      0 0 0 var(--amiga-fg) !important;
    transform: translate(1px, 1px);
  }
  .amiga-gadget.primary{
    background: var(--amiga-accent) !important;
    color: var(--amiga-fg) !important;
    font-weight: 700;
    box-shadow:
      inset 1px 1px 0 #FFD7A0,
      inset -1px -1px 0 #8A4500,
      1px 1px 0 var(--amiga-fg) !important;
  }

  /* Inset frame for content panels (sunken) */
  .amiga-inset{
    background: var(--amiga-paper);
    border: 1px solid var(--amiga-fg);
    box-shadow:
      inset 1px 1px 0 #888,
      inset -1px -1px 0 var(--amiga-paper);
  }

  /* Override any leftover hard borders on inner panels — handled per-component */
</style>
