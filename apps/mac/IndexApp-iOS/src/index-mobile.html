<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover so the desktop blue runs under the notch / home bar;
     no user scaling so it feels like an app, not a web page. -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>index — pocket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    /* Amiga Workbench 1.x 4-color palette — identical to the desktop build */
    --amiga-bg:     #0055AA;   /* desktop blue */
    --amiga-fg:     #000000;   /* black ink */
    --amiga-paper:  #FFFFFF;   /* window body white */
    --amiga-accent: #FF8A00;   /* title bar / highlight orange */
    --amiga-light:  #FFFFFF;   /* bevel highlight */
    --amiga-dark:   #000000;   /* bevel shadow */

    --amiga-sans: "IBM Plex Sans Condensed","Tahoma","Geneva",-apple-system,system-ui,sans-serif;
    --amiga-mono: "IBM Plex Sans Condensed","Tahoma","Geneva",-apple-system,system-ui,sans-serif;
    --amiga-title: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Monaco, "Courier New", monospace;

    --mac-sans: var(--amiga-sans);
    --mac-mono: var(--amiga-mono);

    /* Device chrome heights — the status bar and bottom nav reserve room around
       the system safe areas so content never slides under the notch / home bar. */
    --safe-top:    env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --statusbar-h: 26px;
    --bottomnav-h: 54px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body,#root{height:100%}
  html{ -webkit-text-size-adjust:100%; }
  body{
    background:var(--amiga-bg);
    color:var(--amiga-fg);
    font-family: var(--amiga-sans);
    font-size:14px;
    line-height:1.4;
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select:none; user-select:none;
    touch-action: manipulation;
  }
  body, button, input, textarea, select { font-family: var(--amiga-sans); }
  /* inputs need selection + the text cursor back */
  input, textarea { -webkit-user-select:text; user-select:text; }

  /* ---------- Workbench dotted-blue desktop, behind everything ---------- */
  .mob-desktop{
    background-color: var(--amiga-bg);
    background-image: radial-gradient(rgba(255,255,255,0.20) 1px, transparent 1px);
    background-size: 4px 4px;
  }

  /* ---------- App frame: status bar / content / bottom nav ---------- */
  .mob-frame{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    background: var(--amiga-bg);
  }
  /* thin Workbench-white status strip, pushed below the system status bar */
  .mob-statusbar{
    flex:0 0 auto;
    padding-top: var(--safe-top);
    background: var(--amiga-paper);
    border-bottom: 2px solid var(--amiga-fg);
  }
  .mob-statusbar .bar{
    height: var(--statusbar-h);
    display:flex; align-items:center; gap:8px;
    padding:0 12px;
    font-family: var(--amiga-sans);
    font-size:13px; letter-spacing:0.3px;
    color: var(--amiga-fg);
  }
  .mob-statusbar .bar .bold{ font-weight:700; }
  .mob-statusbar .bar .right{ margin-left:auto; display:flex; align-items:center; gap:8px; color:#555; font-size:12px; white-space:nowrap; }

  /* content area fills the gap; each screen scrolls internally */
  .mob-content{ flex:1 1 auto; min-height:0; position:relative; overflow:hidden; }

  /* ---------- Bottom tab bar (Workbench gadget strip) ---------- */
  .mob-bottomnav{
    flex:0 0 auto;
    padding-bottom: var(--safe-bottom);
    background: var(--amiga-paper);
    border-top: 2px solid var(--amiga-fg);
    display:flex;
  }
  .mob-bottomnav .tab{
    flex:1 1 0; min-width:0;
    height: var(--bottomnav-h);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    border:none; background: var(--amiga-paper);
    border-right: 1px solid var(--amiga-fg);
    color: var(--amiga-fg);
    font-family: var(--amiga-mono);
    cursor:pointer; position:relative;
    -webkit-appearance:none; appearance:none;
  }
  .mob-bottomnav .tab:last-child{ border-right:none; }
  .mob-bottomnav .tab.active{
    background: var(--amiga-accent);
    box-shadow: inset 2px 2px 0 #FFD7A0, inset -2px -2px 0 #8A4500;
  }
  .mob-bottomnav .tab .glyph{ font-size:17px; font-weight:700; line-height:1; }
  .mob-bottomnav .tab .label{ font-size:9px; letter-spacing:1px; text-transform:uppercase; }
  .mob-bottomnav .tab .badge{
    position:absolute; top:5px; right:18px;
    min-width:16px; height:16px; padding:0 3px;
    display:grid; place-items:center;
    background:#000; color:#fff;
    border:1px solid #000;
    font-size:9px; font-weight:700; line-height:1;
  }
  .mob-bottomnav .tab.active .badge{ background:#000; color:var(--amiga-accent); }

  /* ---------- Workbench window / sheet chrome ---------- */
  .amiga-window{
    background: var(--amiga-paper);
    border: 2px solid var(--amiga-fg);
    box-shadow: inset 2px 2px 0 var(--amiga-paper), inset -2px -2px 0 #6E6E6E;
  }
  /* full-screen sheet that slides up over the tabs */
  .mob-sheet{
    position:absolute; inset:0; z-index:50;
    background: var(--amiga-paper);
    display:flex; flex-direction:column;
    animation: sheet-up 220ms cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes sheet-up { from{ transform:translateY(100%) } to{ transform:translateY(0) } }
  /* sheet / panel title bar: Workbench drag-bar with a left close gadget */
  .mob-titlebar{
    flex:0 0 auto; height:34px;
    border-bottom: 2px solid var(--amiga-fg);
    background: var(--amiga-paper);
    display:flex; align-items:stretch;
    font-family: var(--amiga-title);
    user-select:none;
  }
  .mob-titlebar .close{
    width:40px; flex:0 0 auto;
    border-right:2px solid var(--amiga-fg);
    background:var(--amiga-paper);
    position:relative; cursor:pointer;
    -webkit-appearance:none; appearance:none;
  }
  .mob-titlebar .close::before{
    content:""; position:absolute; left:11px; top:11px; right:11px; bottom:11px;
    border:2px solid var(--amiga-fg); background:var(--amiga-paper);
  }
  .mob-titlebar .close:active{ background: var(--amiga-accent); }
  .mob-titlebar .title{
    flex:1; min-width:0; display:flex; align-items:center;
    font-size:14px; font-weight:600; letter-spacing:0.3px; color:var(--amiga-fg);
    overflow:hidden;
    background-image: repeating-linear-gradient(0deg, var(--amiga-fg) 0 2px, transparent 2px 6px);
    background-position:0 6px;
  }
  .mob-titlebar .title > .t{
    background: var(--amiga-paper);
    padding:0 14px; margin-left:6px; height:100%;
    display:flex; align-items:center; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }

  /* ---------- Scrollbars: hide on touch, keep momentum ---------- */
  .mac-scroll{ -webkit-overflow-scrolling: touch; }
  .mac-scroll::-webkit-scrollbar{ width:0; height:0; }

  /* ---------- Animations (kept from desktop) ---------- */
  @keyframes mac-blink { 50%{ opacity:0.15 } }
  @keyframes mac-orbit { from{ transform:rotate(0deg) } to{ transform:rotate(360deg) } }
  @keyframes mac-stripes { from{ background-position:0 0 } to{ background-position:24px 0 } }
  @keyframes fade-up { from{ opacity:0; transform:translateY(4px) } to{ opacity:1; transform:translateY(0) } }
  @keyframes fade-in { from{ opacity:0 } to{ opacity:1 } }
  .fade-up{ animation: fade-up 260ms cubic-bezier(.2,.7,.2,1) both }
  .fade-in{ animation: fade-in 500ms ease both }
  .mac-caret::after{ content:"_"; margin-left:2px; animation: mac-blink 1s steps(2) infinite; color: var(--amiga-accent); font-weight:700; }

  ::selection{ background: var(--amiga-accent); color: var(--amiga-fg) }
  input::placeholder, textarea::placeholder{ color:#888 }
  a,button{ color:inherit; font:inherit; background:none; border:none; padding:0 }
  button{ cursor:pointer }

  /* ---------- Amiga gadget (button) ---------- */
  .amiga-gadget{
    border:1px solid var(--amiga-fg) !important;
    background: var(--amiga-paper) !important;
    color: var(--amiga-fg) !important;
    box-shadow: inset 1px 1px 0 var(--amiga-light), inset -1px -1px 0 #888, 1px 1px 0 var(--amiga-fg) !important;
    border-radius:0 !important;
    font-family: var(--amiga-mono);
    text-transform: lowercase; letter-spacing:0.5px;
  }
  .amiga-gadget:active{
    box-shadow: inset 1px 1px 0 #888, inset -1px -1px 0 var(--amiga-light), 0 0 0 var(--amiga-fg) !important;
    transform: translate(1px,1px);
  }
  .amiga-gadget.primary{
    background: var(--amiga-accent) !important; color: var(--amiga-fg) !important; font-weight:700;
    box-shadow: inset 1px 1px 0 #FFD7A0, inset -1px -1px 0 #8A4500, 1px 1px 0 var(--amiga-fg) !important;
  }
  .amiga-inset{
    background: var(--amiga-paper); border:1px solid var(--amiga-fg);
    box-shadow: inset 1px 1px 0 #888, inset -1px -1px 0 var(--amiga-paper);
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="index-mobile/data.jsx"></script>
<script type="text/babel" src="index-mobile/primitives.jsx"></script>
<script type="text/babel" src="index-mobile/logic.jsx"></script>
<script type="text/babel" src="index-mobile/intents.jsx"></script>
<script type="text/babel" src="index-mobile/mainview.jsx"></script>
<script type="text/babel" src="index-mobile/app.jsx"></script>

</body>
</html>
