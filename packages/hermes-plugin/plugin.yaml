name: index-network
version: 0.26.0
description: Index Network Hermes plugin with native tools backed by Index MCP and REST APIs.
provides_tools:
  - index_read_intents
  - index_research_profile
  - index_create_intent
  - index_update_intent
  - index_create_intent_index
  - index_read_intent_indexes
  - index_search_intents
  - index_read_networks
  - index_read_network_memberships
  - index_update_network
  - index_create_network
  - index_create_network_membership
  - index_list_opportunities
  - index_update_opportunity
  - index_confirm_opportunity_delivery
  - index_create_premise
  - index_read_premises
  - index_update_premise
  - index_retract_premise
  - index_read_activity_summary
  - index_read_docs
  - index_agent_me
  - index_open_app
# The plugin authenticates with the INDEX_API_KEY environment variable
# (an agent API key created in Index web settings).
